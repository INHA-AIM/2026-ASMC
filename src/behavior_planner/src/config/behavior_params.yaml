behavior: {update_rate: 10.0}
interface_version: "v1"
v2: {command_validity_seconds: 0.5, feedback_stale_seconds: 1.0}
# Match Frenet's configured FOLLOW acquisition gate. A previously acquired
# target is retained briefly across perception dropouts before KEEP release.
follow: {max_target_distance: 60.0, max_lateral_offset: 1.75, release_delay_s: 0.4}
# AVOID is selected only when an UNKNOWN/STATIC OBB overlaps the ego-sized
# route corridor. max_lateral_offset remains a defensive acquisition ceiling.
avoid: {max_target_distance: 120.0, max_lateral_offset: 1.75, path_margin_m: 0.4}
objects: {input_type: "morai", stale_seconds: 0.3}
map:
  link_set_path: "$(find behavior_planner)/src/config/link_set.json"
  node_set_path: "$(find behavior_planner)/src/config/node_set.json"
route: {route_links_path: "$(find behavior_planner)/src/config/route_links_1.yaml"}
traffic_light:
  use_mock: false
  topic: "/traffic_light/state"
  stale_seconds: 1.0
  mock_path: "$(find behavior_planner)/src/config/traffic_light_mock.yaml"
vehicle: {length: 4.7, width: 1.85, wheelbase: 3.0}
lane: {default_width: 3.5}
safety:
  front_min_gap: 8.0
  follow_time_gap: 1.5
  lane_change_front_gap: 12.0
  lane_change_rear_gap: 15.0
  emergency_ttc_enter: 2.0
  emergency_predicted_ttc: 2.0
  emergency_ttc_exit: 3.0
  emergency_release_hold_s: 0.5
  emergency_required_decel: 5.0
  pedestrian_stop_distance: 15.0
# VehicleState is referenced at the rear axle. IONIQ 5 length (~4.7 m) plus
# 0.3 m clearance keeps the complete vehicle conservatively before the line.
stop:
  target_offset_m: 5.0
  # 저속 신호 검출 거리의 하한. 실제 활성화 거리는 아래 식과 이 값 중 큰 값:
  # v^2/(2*comfortable_decel) + braking_margin + target_offset_m
  #   + planner_stop_buffer
  red_light_stop_distance: 30.0
  # Frenet planner/stop 값과 함께 변경해야 동일한 제동 의도를 유지한다.
  comfortable_decel: 1.5
  braking_margin: 4.0
  planner_stop_buffer: 0.5
score_weight: {safety: 1.0, route: 0.8, efficiency: 0.5, comfort: 0.2}
topics: {ego: "/vehicle/state", objects: "/Object_topic", plan_feedback: "/planning/feedback", frenet_feedback_v2: "/planning/frenet_feedback_v2"}
publish_topics: {behavior_context: "/behavior/context", behavior_command_v2: "/behavior/command_v2", feature_debug: "/behavior/feature_debug", marker: "/behavior/markers"}
