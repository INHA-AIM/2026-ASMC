# =========================================================
# MPC Configuration
# =========================================================

control_frequency: 20.0

mpc:
  horizon: 36           # 28(1.4s)->36(1.8s): 코너 진입을 더 일찍 내다보도록 확장. dt는 그대로.
  dt: 0.05             # control_frequency(20Hz=50ms)와 정합.
  max_iterations: 25
  wheelbase: 3.0

cost:
  path_error: 6.0
  heading_error: 3.0      # 6.0→3.0: 과도한 heading 보정이 오버슈트 유발
  speed_error: 2.0        # 3.0→2.0: 급정거 방지
  control: 1.25            # 2.0→1.0: steer effort 페널티 완화
  # 100.0 -> 70.0: MORAI 실측에서 커브 진입 시 steer_cmd가 필요한 방향으로
  # 바뀌는 시점이 늦어(kappa_ref/steer_ff는 이미 반대 부호인데 steer_cmd가
  # 여전히 이전 값 근처) Frenet d가 1m 이상 벌어지는 현상이 관찰됐다. 이
  # cost는 dt 정규화로 rate_scale(=0.1/dt=2.0)이 곱해져 실질 가중치가
  # 200이라, warm-start(이전 해를 한 스텝 shift)가 새 곡률 방향으로 벗어나는
  # 것을 강하게 억제한다. steering.max_rate(물리 한계, 아래 constraints)는
  # 그대로 두고 이 soft penalty만 30% 낮추는 첫 실측 trial이다 - 최종값은
  # 다음 MORAI 결과로 결정한다.
  control_rate: 70.0
  control_rate_accel: 4.5
  terminal: 8.0

solver:
  lr_init: 0.20
  lr_min: 0.0001
  convergence_eps: 0.001
  line_search_steps: 7

constraints:
  steering:
    max_angle: 0.63268    # 36.25 deg [rad]: MORAI bridge/실제 차량 물리 한계와 일치 (config/runtime.yaml vehicle/max_steer_deg)
    max_rate: 1.0         # 0.4→1.0: 너무 작으면 solver 출력이 매 사이클 잘려서 흔들림
  acceleration:
    max_forward: 2.0
    max_reverse: -5.0
  velocity:
    min: 0.0
    max: 60.0

# MORAI longlCmdType=1 pedal mapping. Official IONIQ 5 100-0 km/h data
# (3.08 s, 43.73 m) gives approximately 8.9 m/s^2 full-brake deceleration.
# This is deliberately separate from the MPC acceleration constraint above.
control_mapping:
  brake_full_decel: 8.9

# 목표 경로가 실제로 전진하는데 차량만 정지한 경우의 공통 복구 계층.
# STOP/WAIT처럼 경로 목표속도가 0인 정상 정지에는 작동하지 않는다.
stuck_recovery:
  ego_speed_threshold: 0.1     # [m/s] 이 이하면 정지로 판정
  target_speed_threshold: 0.3  # [m/s] 경로가 이보다 빨라야 주행 의도가 있다고 판정
  min_path_progress: 0.5       # [m] horizon 경로가 실제 전진해야 함
  timeout: 1.0                 # [s] 정지가 이 시간 지속되면 복구 시작
  duration: 0.75               # [s] 한 번의 제한된 launch assist 시간
  launch_accel: 0.5            # [m/s^2] 복구 중 최소 요구 가속도
