name: lidar_v3_gt_udp
description: Privileged Autonav v3 Intensity/Semantic/Instance LiDAR sequence over UDP.
kind: raw
transport: udp
timestamp_mode: source
sensor_set: ASMC_sensor_set_GT
map: kcity2025
compression: none
privileged_gt: true
deployment_allowed: false
require_nonempty_topics: true
required_topics:
  - /velodyne_points
  - /velodyne_points_semantic
  - /velodyne_points_instance
  - /Object_topic
  - /gps
  - /imu
  - /Ego_topic
optional_topics:
  - /tf
  - /tf_static
  - /morai_sensor_bridge/diagnostics
  - /morai_udp_bridge/diagnostics
expected_types:
  /velodyne_points: sensor_msgs/PointCloud2
  /velodyne_points_semantic: sensor_msgs/PointCloud2
  /velodyne_points_instance: sensor_msgs/PointCloud2
  /Object_topic: morai_msgs/ObjectStatusList
  /gps: morai_msgs/GPSMessage
  /imu: sensor_msgs/Imu
  /Ego_topic: morai_msgs/EgoVehicleStatus
timestamp_provenance:
  lidar: velodyne_device_time_unwrapped
  imu_ego_object: morai_packet_source_time
  gps: bridge_receive_time
