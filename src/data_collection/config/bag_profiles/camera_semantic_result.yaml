name: camera_semantic_result
description: Model outputs and structured diagnostics linked to an immutable raw run.
kind: result
transport: replay
timestamp_mode: replay
timestamp_provenance:
  output_header: inherited from the parent raw camera header
  diagnostics_header: replay clock at diagnostic publication
  bag_time: replay clock at result recorder receipt
sensor_set: replay_parent
map: kcity2025
compression: lz4
privileged_gt: false
deployment_allowed: true
required_topics:
  - /perception/camera/diagnostics
optional_topics:
  - /perception/camera/front/drivable/probability
  - /perception/camera/front/lane/probability
  - /perception/camera/front/road_marking/class_id
  - /perception/camera/left/drivable/probability
  - /perception/camera/left/lane/probability
  - /perception/camera/left/road_marking/class_id
  - /perception/camera/right/drivable/probability
  - /perception/camera/right/lane/probability
  - /perception/camera/right/road_marking/class_id
expected_types:
  /perception/camera/diagnostics: diagnostic_msgs/DiagnosticArray
