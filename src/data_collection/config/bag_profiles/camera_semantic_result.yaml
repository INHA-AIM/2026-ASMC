  - /perception/camera/front/road_marking/confidence
  - /perception/camera/front/road_marking/model_grid/class_id
  - /perception/camera/front/road_marking/model_grid/confidence
  - /perception/camera/left/drivable/probability
  - /perception/camera/left/lane/probability
  - /perception/camera/left/road_marking/class_id
  - /perception/camera/left/road_marking/confidence
  - /perception/camera/left/road_marking/model_grid/class_id
  - /perception/camera/left/road_marking/model_grid/confidence
  - /perception/camera/right/drivable/probability
