  - /perception/camera/right/road_marking/model_grid/confidence
  - /perception/bev/debug/front/drivable_probability
  - /perception/bev/debug/front/road_marking/class_id
  - /perception/bev/debug/front/road_marking/confidence
  - /perception/bev/debug/front/coverage
  - /perception/bev/debug/left/drivable_probability
  - /perception/bev/debug/left/road_marking/class_id
  - /perception/bev/debug/left/road_marking/confidence
  - /perception/bev/debug/left/coverage
  - /perception/bev/debug/right/drivable_probability
  - /perception/bev/debug/right/road_marking/class_id
