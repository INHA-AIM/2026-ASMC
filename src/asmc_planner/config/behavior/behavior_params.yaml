behavior: {update_rate: 10.0}
# MORAI-only cruise profile: on ordinary KEEP links with map cap >= 40 km/h,
# replace that cap with 58. Explicit link caps below apply only through the
# same ordinary-driving gate. The original map is unchanged.
# Signal approach, obstacle handling, FOLLOW, STOP and roundabout merge take
# precedence. Unlisted lower-speed links and downstream curvature limits remain.
# Nominal target/cap 58; verify actual speed stays below 60 in simulator Bags.
# This is a requested cruise speed, not a guaranteed measured segment average.
normal_cruise:
  enabled: true
  target_speed_kph: 58.0
  max_speed_kph: 58.0
  minimum_map_speed_kph: 40.0
  # Ordinary exit road after roundabout merge; merge links retain their limits.
  link_speed_caps_kph:
    A2256W000054: 50.0
interface_version: "v1"
v2: {command_validity_seconds: 0.5, feedback_stale_seconds: 1.0}
# Match Frenet's configured FOLLOW acquisition gate. A previously acquired
# target is retained briefly across perception dropouts before KEEP release.
follow: {max_target_distance: 60.0, max_lateral_offset: 1.75, release_delay_s: 0.4}
# AVOID uses the OBB's lateral overlap with the ego swept corridor. Strong
# physical intrusion is immediate; boundary/margin intrusion needs a meaningful
# share for consecutive frames. Height is deliberately not used here.
avoid:
  max_target_distance: 120.0
  max_lateral_offset: 1.75
  path_margin_m: 0.4
  min_physical_overlap_m: 0.10
  min_margin_overlap_m: 0.20
  min_overlap_ratio: 0.20
  # physical overlap / min(OBB projected width, ego width)
  immediate_blocking_ratio: 0.70
  blocking_enter_ratio: 0.20
  blocking_exit_ratio: 0.15
  overlap_confirm_cycles: 2
  overlap_release_cycles: 3
  reconnect_grace_cycles: 5
  reconnect_max_longitudinal_delta_m: 3.0
  reconnect_max_lateral_delta_m: 0.8
  reconnect_max_size_delta_m: 1.5
  release_grace_cycles: 3
# Object input must remain fresh on every Frenet cycle, including map-only roads.
# Consumption guide: docs/handoffs/perception-to-planning.md (no new gate here).
# Unit 2 includes all of A153 and ends at A451 entry; shadow is A126, with
# camera family ready BEFORE A126. A448 is an approach, not a cold-start deadline.
objects: {input_type: "morai", stale_seconds: 0.3}
map:
  link_set_path: "$(find asmc_planner)/config/behavior/link_set.json"
  node_set_path: "$(find asmc_planner)/config/behavior/node_set.json"
route: {route_links_path: "$(find asmc_planner)/config/behavior/route_links_1.yaml"}
traffic_light:
  # Camera ResNet now runs continuously; A236 start..A308 end is the reviewed
  # consumption scope. It does not disable this input or change signal rules.
  use_mock: false
  # P4-C3 canonical input. Keep `topic` below until every deployment starts
  # asmc_camera; it is fallback-only after the first typed sample arrives.
  typed_topic: "/perception/traffic_light/detection"
  topic: "/traffic_light/state"
  stale_seconds: 1.0
  # 토픽은 살아 있지만 분류기가 잠깐 not_detected를 낼 때 가시성만 유지한다.
  # semantic light_state와 raw label은 현재 frame 값을 그대로 사용한다.
  detection_grace_seconds: 1.0
  # 카메라 검출 여부와 무관하게 route-associated map stop line에 대해,
  # 현재 실제 속도에서 감속하여 물리 정지선 25 m 전에 25 km/h에
  # 도달하는 것을 목표로 한다. 신호 접근 감속 가정은 1.5 m/s^2로 유지한다.
  # 일반 곡선 감속 설정과 독립적이며 jerk/제어 지연은 Bag으로 확인한다.
  # 정지선 통과 뒤 5 m까지 유지하고 이후 지도·곡률이 허용하는 속도로 복귀한다.
  # 한 번 시작한 감속은 같은 정지선에 latch된다. RED/YELLOW STOP과는 별도다.
  # MORAI 시험: 동적 장애물 구간의 신호 접근 25 km/h, 일반 구간 상한 58 km/h.
  # 전체 평균 50 km/h 달성 여부는 저속 구간·신호 대기를 포함해 별도 측정한다.
  approach_speed_limit_kph: 25.0
  approach_comfortable_decel: 1.5
  approach_margin_m: 25.0
  post_stopline_distance_m: 5.0
  mock_path: "$(find asmc_planner)/config/behavior/traffic_light_mock.yaml"
vehicle: {length: 4.635, width: 1.892, wheelbase: 3.0}
lane: {default_width: 3.5}
safety:
  front_min_gap: 8.0
  follow_time_gap: 1.5
  lane_change_front_gap: 12.0
  lane_change_rear_gap: 15.0
  emergency_ttc_enter: 2.0
  emergency_predicted_ttc: 2.0
  emergency_ttc_exit: 3.0
  emergency_release_hold_s: 0.5
  emergency_required_decel: 5.0
  pedestrian_stop_distance: 15.0
# VehicleState is referenced at the rear axle. IONIQ 5 length (~4.7 m) plus
# 0.3 m clearance keeps the complete vehicle conservatively before the line.
stop:
  target_offset_m: 5.0
  # 저속 신호 검출 거리의 하한. 실제 활성화 거리는 아래 식과 이 값 중 큰 값:
  # v^2/(2*comfortable_decel) + braking_margin + target_offset_m
  #   + planner_stop_buffer
  red_light_stop_distance: 30.0
  # Frenet planner/stop 값과 함께 변경해야 동일한 제동 의도를 유지한다.
  comfortable_decel: 1.5
  braking_margin: 4.0
  planner_stop_buffer: 0.5
score_weight: {safety: 1.0, route: 0.8, efficiency: 0.5, comfort: 0.2}
topics: {ego: "/vehicle/state", objects: "/Object_topic", plan_feedback: "/planning/feedback", frenet_feedback_v2: "/planning/frenet_feedback_v2"}
publish_topics: {behavior_context: "/behavior/context", behavior_command_v2: "/behavior/command_v2", feature_debug: "/behavior/feature_debug", marker: "/behavior/markers"}

# Both planners enabled together for MORAI driving validation.
# A single map-defined entry; highway MERGE and lane changes stay separate.
roundabout_merge:
  enabled: true
  source_link: A2256W000148
  target_link: A2256W000146
  stop_node: A1256W000709
  conflict_links: [A2256W000134, A2256W000151]
  speed_cap_mps: 6.944444444444445
  preview_distance_m: 45.0
  max_horizon_s: 10.0
