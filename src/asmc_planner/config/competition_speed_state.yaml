# MORAI integration test settings; not certified sensor-error bounds.
# Source/reference time alignment and steady receive freshness are separate.
source_age_s: 0.10
receive_age_s: 0.30 # merge bag p99 receive gap 0.253 s; source alignment remains <=0.10 s
restart_jump_s: 0.50
# Full-run 8: signed stationary jitter reached -0.041m/s. This provisional
# band is below existing 0.1m/s MERGE hold and 0.15m/s STOP tolerances.
stationary_deadband_mps: 0.05
# User-standard MORAI preset sends CompetitionInfoPublisher (295) to UDP9099.
# The existing, unchanged UDP bridge names that receiver /Ego_topic. Only its
# longitudinal speed is consumed; GPS/IMU still owns every pose field. This
# is a pinned deployment source, not an automatic Ego-status fallback.
speed_topic: /Ego_topic
speed_callerid: /morai_udp_bridge
pose_topic: /planning/vehicle/gps_imu_state
state_topic: /planning/vehicle/state
