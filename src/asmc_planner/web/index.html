<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Behavior Planner Console</title>
  <link rel="stylesheet" href="dashboard.css">
  <style>.legend .trajectory{background:#ffd447}.legend .candidate-valid{background:#75bfff}.legend .candidate-rejected{background:#ff5263}.legend .ego{width:0;height:0;background:transparent;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:11px solid #fff;filter:drop-shadow(0 0 1px #39e58c)}.legend .npc{width:9px;height:9px;border-radius:50%;background:#ff9b4a}.legend .signal{width:9px;height:9px;border-radius:50%;background:#39e58c;border:1px solid #fff}.legend .stop{position:relative;width:9px;height:9px;background:#ff9b4a;border:1px solid #fff;transform:rotate(45deg)}.legend .stop:after{content:'+';position:absolute;left:-5px;top:-9px;color:#ff9b4a;font:bold 15px sans-serif;transform:rotate(-45deg)}</style>
</head>
<body>
  <header>
    <div><span class="logo">BP</span><b>Behavior Planner Console</b></div>
    <div class="header-right"><span id="mapStatus" class="chip">MAP LOADING</span><span id="rosStatus" class="chip bad">ROS OFFLINE</span></div>
  </header>
  <main>
    <section class="map-panel">
      <canvas id="map"></canvas>
      <div class="toolbar">
        <button id="fit">전체 지도</button><button id="follow">Ego 추적</button>
        <label><input id="showNodes" type="checkbox">노드</label>
        <label><input id="showObjects" type="checkbox" checked>객체</label>
        <label><input id="showSignals" type="checkbox" checked>신호</label>
        <label><input id="showTrajectory" type="checkbox" checked>Frenet 경로</label>
      </div>
      <div class="legend">
        <span><i class="route"></i>글로벌 경로</span>
        <span><i class="required"></i>현재 글로벌패스 구간</span><span><i class="target"></i>기동 목표 링크(있을 때)</span>
        <span><i class="ego"></i>Ego 차량</span><span><i class="npc"></i>주변 차량(NPC)</span><span><i class="signal"></i>신호등</span>
        <span><i class="candidate-valid"></i>유효 후보</span><span><i class="candidate-rejected"></i>탈락 후보</span>
        <span><i class="trajectory"></i>Frenet 선택 궤적</span><span><i class="stop"></i>정지 목표</span>
      </div>
      <div id="cursor" class="cursor"></div>
    </section>
    <aside>
      <section class="hero">
        <div><span class="label">SELECTED BEHAVIOR</span><h1 id="behaviorName">WAITING</h1><span id="behaviorCode" class="code">–</span></div>
        <div class="state"><span class="label">FSM STATE</span><strong id="stateName">–</strong><small id="stateCode">–</small></div>
      </section>
      <section><h2>Link & Motion</h2><div id="linkGrid" class="kv"></div></section>
      <section><h2>Front & Risk</h2><div id="riskGrid" class="kv"></div></section>
      <section><h2>Behavior Enable</h2><div id="enableGrid" class="flags"></div></section>
      <section><h2>Scores</h2><div id="scores"></div></section>
      <section><h2>Decision</h2><div id="reasons" class="reasons"></div></section>
      <section><h2>Selected Link</h2><div id="selectedLink" class="mono muted">지도 링크를 클릭하세요.</div></section>
      <section><h2>Topic Health</h2><div id="health" class="kv"></div></section>
    </aside>
  </main>
  <script src="dashboard.js?v=planning-debug-6"></script>
</body>
</html>
