network:
  host_ip: "0.0.0.0"        # 이 프로세스가 bind할 IP (MORAI ego/object 수신용)
  mpc_ip: "127.0.0.1"         # mpc_node로 PlannedPath를 보낼 목적지 IP

  # ego_udp는 개발 진단 전용이다. 본선 기본 localization은 GPS/IMU다.
  ego_vehicle_dst_port: 909

  # LiDAR가 추적한 객체를 받는 전용 입력이다. MORAI 기본 ObjectInfo 포트
  # 7505와 raw LiDAR 입력 포트 9299는 이 경로에서 사용하지 않는다.
  object_info:
    enabled: true
    dst_port: 7510  # LiDAR tracked-object output

  # morai_sensor_bridge가 MORAI 원본(9301/9303)을 복제하는 planner 전용 포트.
  # 센서 브릿지와 standalone planner의 UDP bind 충돌을 피한다.
  gps_dst_port: 9401
  imu_dst_port: 9403

  # MORAI GPS Info 창에 표시되는 UTM52N map offset. global path 좌표는
  # UTM Easting/Northing에서 이 값을 뺀 로컬 좌표다.
  gps_utm_offset:
    east: 302595.0
    north: 4124145.0

  localization:
    source: "gps_imu"       # ego_udp | gps_imu
    gps_timeout: 0.5       # [s] 초과 시 GPS/IMU pose 무효
    imu_timeout: 0.15      # [s]
    max_prediction_time: 0.5  # [s] 마지막 GPS fix 이후 정속 예측 상한

  # mpc_node의 udp_network/network.yaml에 있는 planned_path_host_port와
  # 반드시 같은 값이어야 한다.
  planned_path_dst_port: 9300
