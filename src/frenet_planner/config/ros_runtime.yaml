planning:
  frequency: 20.0

timeouts:
  vehicle_state: 0.50
  objects: 0.30
  behavior: 0.50

topics:
  vehicle_state: /vehicle/state
  objects: /perception/objects
  behavior: /behavior/context

publish_topics:
  trajectory: /planning/trajectory
  feedback: /planning/feedback

# v2 인터페이스 (FSM <-> Frenet)
v2:
  stop:
    # [rad] STOP target pose의 허용 heading 오차. 투영점의 reference yaw와
    # 목표 pose yaw의 차이가 이 값을 넘으면 TARGET_PROJECTION_FAILED로
    # 거부한다. 왕복 구간이 나란히 지나갈 때 반대 방향 구간에 목표가 붙는
    # 것을 막는다 (계약 문서 3.4절).
    #
    # 기본값 45도(0.785398). 초기 개발값이며 MORAI 검증 후 조인다 - 너무
    # 좁으면 정상 STOP이 거부되고, 너무 넓으면 반대 방향을 통과시킨다.
    max_target_heading_error_rad: 0.785398
