# =========================================================
# Frenet Frame Planner 파라미터 (mpc_controller에 통합된 버전)
# 행동 모드는 외부 FSM(BehaviorCommand)이 지정하고, frenet_planner는 그
# 명령을 trajectory로 만드는 실행만 담당한다.
# =========================================================

planner:
  wheelbase: 3.0    # [m] mpc_controller/config/mpc_params.yaml과 동일 값 유지
  lane_width: 3.5   # [m] LANE_CHANGE 오프셋, "내 차선" 판정(|d|<=lane_width/2)에 사용

  # [s] frenet_planner_node의 planning/frequency 기본값(20Hz)과 동일하게
  # 유지한다. target speed recovery rate limiter(Phase 2)가 사용하는
  # replanning 주기이며, path_generator/dt(trajectory 샘플 간격, 아래)와는
  # 다른 값이다 - 절대 섞어 쓰지 않는다 (fix/yuntae-frenet-speed-continuity).
  replanning_period_s: 0.05
  # [m/s^2] target speed가 이전 cycle보다 증가하는 방향에만 적용하는 초기
  # safety rate limit. 최종 MORAI tuning 값이 아니다.
  max_target_speed_accel: 2.0

  # --- 곡률 기반 사전 감속 (mpc_controller 옛 path_planner.cpp에서 이식) ---
  # 현재 production 속도 정책은 VelocityFromCurvature(Speed/CurveSpeed.cpp)의
  # 물리 기반 계산(max_lateral_accel로부터 유도한 sqrt(a_lat*margin/|kappa|),
  # target_vel로 clip)만 쓴다. curve_vel_sharp/mid/mild와
  # curve_th_sharp/mid/mild는 여기서 로드는 되지만 아직 그 계산에 반영되지
  # 않는다 - 이산 구간별 comfort/safety 상한을 추가로 걸지는 별도 튜닝
  # 작업에서 결정한다. 지금 이 값들을 바꿔도 실제 주행 속도는 변하지 않는다.
  curve_speed:
    target_vel: 10.0
    curve_vel_sharp: 4.0
    curve_vel_mid:   5.5
    curve_vel_mild:  7.0
    curve_th_sharp:  0.080
    curve_th_mid:    0.035
    curve_th_mild:   0.015
    curve_lookahead_m: 15.0

  # --- Following(Sec.V-A, constant-time-gap-law) ---
  # FSM이 BehaviorCommand.primary_object_id로 지정한 FOLLOW 대상의 유효성
  # 검증 범위(max_leader_search_s/exit_search_margin)와 constant-time-gap-law
  # 종방향 목표 계산(time_gap/min_gap/gap_gain)에 쓴다. planner가 스스로
  # leader를 고르지 않는다 - FSM이 지정한 대상만 검증한다.
  following:
    time_gap: 1.0              # [s] tau - 목표 gap = min_gap + time_gap*leader_speed
    min_gap: 5.0               # [m] D0 - 정지 시에도 유지할 최소 거리
    gap_gain: 0.3              # [1/s] 간격 오차를 접근 속도로 변환하는 폐루프 이득
    max_leader_search_s: 60.0  # [m] FSM이 지정한 대상까지 이 거리 안이어야 유효
    exit_search_margin: 10.0   # [m] 확보 후 유지용 탐색거리 hysteresis
    dropout_grace_cycles: 5    # [cycle] TrackedObject 일시 누락 허용(20Hz 기준 0.25s)

  # --- AVOID: FSM이 지정한 대상의 유효성 검증 범위와 lateral 회피 ---
  avoid:
    detection_distance: 120.0 # [m] KEEP의 8 s reactive horizon보다 넓게 확보해 Behavior/AVOID 사이의 blind band를 없앤다
    avoid_offset: 5.0         # [m] 회피 시 lateral_d1 격자를 밀어낼 크기
    min_shift_start_distance: 15.0 # [m] 저속에서도 확보할 최소 SHIFT 준비거리
    max_shift_start_distance: 70.0 # [m] 고속에서도 지나치게 일찍 이탈하지 않는 상한
    shift_time_margin: 0.5     # [s] 횡이동 계산에 더하는 조향/제어 응답 여유
    lateral_tolerance: 0.4    # [m] SHIFT 횟이동 완료 판정
    rear_overhang: 0.79       # [m] /vehicle/state 후륜축 기준점에서 뒤 범퍼까지 거리
    pass_clearance: 0.3       # [m] 자차/장애물 길이 외 추가 통과 여유
    prefer_right_when_equal: true # 좌/우 valid 품질이 거의 같으면 우측 우선

  # --- LANE_CHANGE: FSM이 target_pose_map으로 지정한 인접 차로 목표로의
  # 횡이동 완료 판정(§17). 초기 개발값이며 MORAI 튜닝 대상이다.
  lane_change:
    lateral_position_tolerance: 0.4  # [m] 목표 d와의 허용 오차
    lateral_speed_tolerance: 0.2     # [m/s] 완료 시점 허용 d_dot
    heading_tolerance: 0.05          # [rad] 목표/참조 heading과의 허용 오차

  # --- 외부 STOP 명령 실행 -----------------------------------
  # STOP은 receding horizon(time_horizon max 5.0s) 안에서 exact-stop 다항식을
  # 항상 만들 수 있는 게 아니다. 멀리 있는 정지 목표는 APPROACH에서 속도만
  # 낮추고, 제동거리 안에 들어왔을 때 BRAKING에서 정지 다항식을 생성한다.
  # 초기 개발값이며 실차/MORAI 튜닝 대상이다.
  stop:
    comfortable_decel: 2.0     # [m/s^2] APPROACH 감속 프로파일과 BRAKING 전환거리
    braking_margin: 3.0        # [m] 제동거리에 더할 BRAKING 전환 여유
    stop_buffer: 0.5           # [m] 정지 목표 앞 여유(오버슈트 축소)

    position_tolerance: 0.5    # [m] HOLD 진입 위치 판정
    speed_tolerance: 0.2       # [m/s] HOLD 진입 속도 판정
    max_lateral_offset: 5.0    # [m] 정지 목표가 경로에서 이보다 멀면 거부
    target_change_tolerance: 2.0 # [m] 이만큼 바뀌면 새 STOP으로 보고 phase 리셋
    # [m] 정지 목표 투영의 탐색창. FindClosestS 기본값 30m는 ego localization용
    # 이라 정지 목표에 쓰면 목표가 창 밖으로 나가 Newton이 다른 구간으로 발산한다.
    # 반드시 실제 최대 stop lookahead보다 크게 유지할 것.
    projection_search_window: 100.0

  # 목표점 없는 AEB/E-STOP 직접 감속 궤적. MPC의 full-brake override와
  # 동일한 최대감속 가정을 사용해 예상 정지 위치가 실제 제어와 맞게 한다.
  emergency_stop:
    decel: 8.9                 # [m/s^2] MORAI IONIQ 5 100-0 평균 최대감속

  # --- 회전교차로 MERGE: global path상의 conflict_s에서 순환 차량의
  # 도착 시간 gap을 확인하고, gap이 없으면 진입점 전에 정지한다. ---
  merge:
    conflict_s: 885.76         # [m] 실측한 회전교차로 대표 합류 충돌점
    approach_distance: 45.0    # [m] 충돌점 전 MERGE 활성 거리
    stop_buffer: 3.5           # [m] 정지 목표 s=882.26 (자차 반길이+안전마진+추가 여유)
    conflict_radius: 6.0       # [m] 순환차 곡선예측의 충돌점 최근접 허용거리
    min_object_speed: 0.5      # [m/s] 이보다 느린 객체는 순환 차량에서 제외
    min_front_time_gap: 1.5    # [s] 선행 순환차 통과 후 최소 여유
    min_rear_time_gap: 2.0     # [s] Ego 진입 후 후속 순환차까지 최소 여유
    ego_clear_time: 1.5        # [s] Ego의 conflict zone 통과 시간
    max_wait_time: 10.0        # [s] 진입 gap 탐색 시간범위
    completion_distance: 8.0   # [m] 충돌점 통과 후 MERGE 종료 거리
    commit_distance: 15.0      # [m] 이 거리부터 선택한 gap을 고정
    safe_confirm_cycles: 3     # 연속 안전 판정 횟수(20Hz)
    cross_speed_floor: 3.0     # [m/s] COMMIT/CROSS 중 교차구역 이탈 최저 목표속도

  # --- 고주로/본선 합류 MERGE --------------------------------
  # 실측한 세 합류 구간의 start/conflict/completion_s를 zone별로 사용한다.
  # Global Path 자체가 본선으로 합류하므로 별도 차선변경 offset은 만들지 않는다.
  highway_merge:
    enabled: true
    zones:
      - name: highway_merge_1
        start_s: 1113.35
        completion_s: 1274.73
        checkpoints:
          - { conflict_s: 1237.04, clear_s: 1274.73 }
      - name: highway_merge_2_3
        start_s: 1424.45
        completion_s: 1583.76
        checkpoints:
          - { conflict_s: 1524.41, clear_s: 1547.54 }
          - { conflict_s: 1564.72, clear_s: 1583.76 }
    approach_distance: 50.0 # 향후 속도 기반 start_s 사전 감지에 사용할 여유
    stop_buffer: 4.0
    target_corridor_half_width: 5.5 # 합류 전 평행한 본선 1개 차로까지 보수적으로 포함
    object_search_distance: 100.0
    min_heading_alignment: 0.5
    min_front_gap: 8.0
    min_rear_gap: 10.0
    min_front_ttc: 2.0
    min_rear_ttc: 3.0
    max_wait_time: 10.0
    commit_distance: 20.0
    safe_confirm_cycles: 3
    cross_speed_floor: 4.0

  # --- 실시간 후보 경로 디버그 시각화 -----------------------
  # Planner가 최신 스냅샷을 원자적으로 갱신하고 tools/planner_visualizer.py가 읽는다.
  visualization:
    enabled: true
    publish_hz: 5.0
    snapshot_path: "/tmp/frenet_planner_debug.json"

  # --- PathGeneratorConfig (path_generator.hpp) ---------------
  path_generator:
    lateral_d1:     { min: -3.0, max: 3.0, step: 0.5 }
    lateral_target_tolerance: 0.5 # [m] 모드별 목표 d 주변에서만 후보 생성
    time_horizon:   { min: 1.5,  max: 5.0, step: 0.5 }
    delta_s:        { min: -3.0, max: 3.0, step: 1.0 }
    delta_s_dot:    { min: -2.0, max: 2.0, step: 1.0 }
    dt: 0.1

  # --- KinematicLimits (path_generator.hpp) -------------------
  kinematic_limits:
    max_lateral_accel: 3.0
    max_longitudinal_accel: 3.0
    # planner feasibility(이 값)는 controller 물리 조향 feasibility를 넘으면
    # 안 된다 - MPC의 reference_validator가 실제로 조향 가능한 최대 곡률을
    # kappa_max = tan(steering_max)/wheelbase로 계산한다(mpc_params.yaml
    # 기준 steering_max=0.63268, wheelbase=3.0 -> kappa_max ~= 0.2444).
    # 이 값이 그보다 크면(과거 0.28) Frenet이 "생성 가능"으로 받아들인
    # trajectory를 MPC가 CURVATURE_OUT_OF_RANGE로 거부해 fail-safe STOP이
    # 발생한다(MORAI 실측 확인). 0.24로 두어 물리 한계 아래 작은 여유를 둔다 -
    # 이 값을 MPC의 kappa_max보다 크게 올리지 않는다.
    max_curvature: 0.24
    # [m/s^3] longitudinal jerk hard limit. initial safety limit; final value
    # requires MORAI validation (fix/yuntae-frenet-speed-continuity).
    # 5.0 -> 6.0: 정상 FOLLOW(큰 time_gap/min_gap) 경계 후보의 실측 peak
    # jerk가 5.28로 5.0을 근소하게 초과해 candidate starvation을 유발했다.
    # excessive jerk reproducer(약 10.67)는 6.0에서도 계속 reject된다.
    max_longitudinal_jerk: 6.0

  # --- CostWeights (cost.hpp) ---------------------------------
  cost_weights:
    kj: 0.1
    kt: 1.0
    kd: 20.0
    kd_path: 35.0
    ks: 1.0
    ks_dot: 1.0
    klat: 1.0
    klon: 1.0

  # --- VehicleShape (collision_checker.hpp) -------------------
  vehicle_shape:
    width: 1.9
    length: 4.635

  # --- CollisionCheckConfig (collision_checker.hpp) -----------
  collision_check:
    safety_margin: 0.5
    margin_growth_rate: 0.1
    reactive_lookahead: 8.0

# FrenetPlanner::Init()은 '/'로 시작하지 않는 값을 FRENET_PACKAGE_SRC_DIR
# (frenet_planner 패키지의 src/) 기준 상대경로로 취급한다. 그 디렉터리에서
# repository 루트의 R_KR_PG_KATRI까지는 항상 3단계 위다
# (src/frenet_planner/src -> src/frenet_planner -> src -> repo root).
waypoint_file: "../../../R_KR_PG_KATRI/2026_molit_comp_global_path.txt"
