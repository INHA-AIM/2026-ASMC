# =========================================================
# MPC Configuration
# =========================================================

control_frequency: 20.0

mpc:
  # Normal KEEP trajectories are usually 1.5 s long. At dt=0.05, 29 steps
  # end at 1.40 s, leaving room for the observed source-time offset instead
  # of repeating the moving endpoint over the former 1.8 s horizon.
  horizon: 29
  dt: 0.05             # control_frequency(20Hz=50ms)와 정합.
  max_iterations: 25
  wheelbase: 3.0
  # 2026-09-11 MORAI IONIQ 5 실측(10/20/30/40deg) 평균:
  # kappa ~= 0.844 * tan(delta) / wheelbase.
  steering_curvature_gain: 0.844
  # MORAI command-to-observed-yaw delay (dynamics + transport), measured on bags.
  # 0 restores the instantaneous model; acceleration is not delayed.
  steering_response_delay_s: 0.15

cost:
  # Keep the straight-road noise response; strengthen tracking progressively
  # on curved reference samples. Steering delay/rate limits remain unchanged.
  contour_error: 6.0
  curve_contour_boost: 6.0
  contour_boost_start_curvature: 0.004  # [1/m], radius 250 m
  contour_boost_full_curvature: 0.012   # [1/m], radius about 83 m
  lag_error: 0.5
  heading_error: 3.0      # 6.0→3.0: 과도한 heading 보정이 오버슈트 유발
  speed_error: 8.0        # Validated with smoothed speed estimates and steering delay.
  control: 1.25            # 2.0→1.0: steer effort 페널티 완화
  control_rate: 110.0     # Matched with the shorter horizon; GPS-step regression retained.
  control_rate_accel: 2.5
  terminal: 8.0

solver:
  lr_init: 0.20
  lr_min: 0.0001
  convergence_eps: 0.001
  line_search_steps: 7

constraints:
  steering:
    # 물리 조향 한계는 공식/실측 입력값 40deg다. 실측 최대 곡률은 위 gain을
    # 적용하면 약 0.236 1/m이며 Frenet 제한 0.23보다 작은 여유를 갖는다.
    max_angle: 0.6981317008
    max_rate: 1.0         # Low-speed ceiling; the speed-dependent envelope follows.
    # Above 18 km/h, reduce slew as (5 / speed_mps)^2, down to min_rate.
    # Applied inside the solver to both warm start and all projected controls.
    # Set the reference speed to 0 to restore the legacy fixed rate limit.
    rate_reference_speed_mps: 5.0
    min_rate: 0.1
  acceleration:
    max_forward: 2.0
    max_reverse: -5.0
  velocity:
    min: 0.0
    max: 60.0

# MORAI longlCmdType=1 pedal mapping. Official IONIQ 5 100-0 km/h data
# (3.08 s, 43.73 m) gives approximately 8.9 m/s^2 full-brake deceleration.
# This is deliberately separate from the MPC acceleration constraint above.
control_mapping:
  # Ordinary STOP only. Identify throttle and brake responses separately.
  # Limit positive MPC acceleration; retain steering warm-start and braking bounds.
  # MERGE and fixed safety brakes keep their existing behavior.
  stop_brake_response:
    enabled: true
    acceleration_limit: 0.5       # [m/s^2] ordinary STOP only; solver bound
    acceleration_minimum_request: 0.15
    learning_time_constant: 0.3
    response_time_constant: 0.1
    minimum_gain: 0.5
    maximum_gain: 2.5
    minimum_request: 0.5
    minimum_speed: 0.5
  brake_full_decel: 8.9
  # 2026-09-10 MORAI IONIQ 5 repeated calibration. The controller computes
  # desired acceleration in m/s^2 and inversely interpolates these monotonic
  # pedal->response curves. STOP/E-STOP fixed overrides are intentionally
  # outside this mapping.
  # Existing 1-D LUT remains enabled. Its response is speed-dependent;
  # these steering changes do not constitute a new pedal calibration.
  use_calibrated_lut: true
  accel:
    pedal:         [0.0, 0.10, 0.15, 0.20, 0.30, 0.40, 0.50, 0.60]
    response_mps2: [0.0, 0.22, 0.38, 0.59, 0.87, 1.18, 1.66, 2.00]
  brake:
    pedal:         [0.0, 0.05, 0.10, 0.15, 0.20, 0.30, 0.50, 0.70]
    response_mps2: [0.0, 0.91, 1.55, 2.05, 2.71, 4.75, 9.50, 10.30]

# 목표 경로가 실제로 전진하는데 차량만 정지한 경우의 공통 복구 계층.
# STOP/WAIT처럼 경로 목표속도가 0인 정상 정지에는 작동하지 않는다.
stuck_recovery:
  ego_speed_threshold: 0.1     # [m/s] 이 이하면 정지로 판정
  target_speed_threshold: 0.3  # [m/s] 경로가 이보다 빨라야 주행 의도가 있다고 판정
  min_path_progress: 0.5       # [m] horizon 경로가 실제 전진해야 함
  timeout: 1.0                 # [s] 정지가 이 시간 지속되면 복구 시작
  duration: 0.75               # [s] 한 번의 제한된 launch assist 시간
  launch_accel: 0.5            # [m/s^2] 복구 중 최소 요구 가속도

