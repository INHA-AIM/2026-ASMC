name: shadow_boundary_family_adapter_result
description: Read-only planning adapter audit for the provisional shared lane-boundary family.
kind: result
transport: replay
timestamp_mode: replay
timestamp_provenance:
  output_header: inherited from the synchronized parent camera headers
  diagnostics_header: replay clock at adapter diagnostic publication
  bag_time: replay clock at result recorder receipt
sensor_set: replay_parent
map: kcity2025
compression: lz4
privileged_gt: false
# The producer and this adapter are both non-deployment candidates. This bag
# must not be selected as an authoritative planning source.
deployment_allowed: false
required_topics:
  - /perception/lane/boundary_family
  - /planning/diagnostics/lane_boundary_family_adapter
optional_topics:
  - /planning/debug/lane_boundary_family/strips
  - /perception/lane/debug/shared_family/diagnostics
  - /perception/lane/pipeline_audit
expected_types:
  /perception/lane/boundary_family: asmc_msgs/LaneBoundaryFamily
  /planning/diagnostics/lane_boundary_family_adapter: diagnostic_msgs/DiagnosticArray
  /planning/debug/lane_boundary_family/strips: visualization_msgs/MarkerArray
  /perception/lane/debug/shared_family/diagnostics: diagnostic_msgs/DiagnosticArray
  /perception/lane/pipeline_audit: diagnostic_msgs/DiagnosticArray
