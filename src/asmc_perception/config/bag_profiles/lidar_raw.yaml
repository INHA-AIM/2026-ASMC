name: lidar_raw
description: Competition-legal intensity LiDAR and localization/state inputs.
kind: raw
transport: udp
timestamp_mode: receive
sensor_set: ASMC_sensor_set_v2
map: kcity2025
compression: none
privileged_gt: false
deployment_allowed: true
required_topics:
  - /velodyne_points
  - /gps
  - /imu
  - /Ego_topic
optional_topics:
  - /ctrl_cmd
  - /tf
  - /tf_static
  - /morai_sensor_bridge/diagnostics
  - /morai_udp_bridge/diagnostics
expected_types:
  /velodyne_points: sensor_msgs/PointCloud2
  /gps: morai_msgs/GPSMessage
  /imu: sensor_msgs/Imu
  /Ego_topic: morai_msgs/EgoVehicleStatus
