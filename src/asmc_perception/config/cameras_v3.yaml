source_sensor_set: config/morai/sensors/ASMC_sensor_set_v3.json
source_sha256: 4c2e93cc4d1139caf92a4e7ed4e20b9c7a705599e7e3faaf247b596e0fd1ae9f

# v3 changes the VLP-16 period from v2 but preserves all four camera poses,
# intrinsics, resolutions and UDP topics.  test_facade_contract.py freezes that
# parity before this snapshot can be used by the canonical facade.
ground_plane:
  frame_id: base_link
  model: plane
  z_at_origin_m: -0.35
  dz_dx: 0.0
  dz_dy: 0.0
  source: lidar_ground_fit_20260911

cameras:
  front:
    sensor_id: 1
    width: 1280
    height: 720
    horizontal_fov_deg: 90.0
    translation_m: [1.90, 0.00, 1.20]
    rotation_deg: [0.0, 2.0, 0.0]
    topics:
      image: /image_jpeg/compressed
      drivable: /perception/camera/front/drivable/probability
      road_marking: /perception/camera/front/road_marking/class_id
      road_marking_confidence: /perception/camera/front/road_marking/confidence

  left:
    sensor_id: 2
    width: 640
    height: 480
    horizontal_fov_deg: 130.0
    translation_m: [1.15, 0.65, 1.20]
    rotation_deg: [0.0, 10.0, 70.0]
    topics:
      image: /cam_left/image_jpeg/compressed
      drivable: /perception/camera/left/drivable/probability
      road_marking: /perception/camera/left/road_marking/class_id
      road_marking_confidence: /perception/camera/left/road_marking/confidence

  right:
    sensor_id: 3
    width: 640
    height: 480
    horizontal_fov_deg: 130.0
    translation_m: [1.15, -0.65, 1.20]
    rotation_deg: [0.0, 10.0, -70.0]
    topics:
      image: /cam_right/image_jpeg/compressed
      drivable: /perception/camera/right/drivable/probability
      road_marking: /perception/camera/right/road_marking/class_id
      road_marking_confidence: /perception/camera/right/road_marking/confidence
