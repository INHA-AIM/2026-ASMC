# Tall-monitor development visualization for the exploration BEV grid.
mosaic_max_hz: 5.0
jpeg_quality: 85
tile_width: 300
tile_height: 438
publish_per_view_mosaic: true

fused_max_hz: 5.0
fused_width: 720
fused_height: 1050

camera_grid_max_hz: 5.0
camera_grid_longitudinal_step_m: 5.0
camera_grid_lateral_step_m: 2.0

# Display the complete development grid.  The label explicitly prevents this
# debug extent from being confused with a validated planning range.
display_x_min_m: -5.0
display_x_max_m: 30.0
display_y_min_m: -12.0
display_y_max_m: 12.0
display_label: "FUSED DEV ROI (UNVALIDATED)"

lane_debug_max_hz: 5.0
lane_debug_width: 720
lane_debug_height: 1050
