# Disabled-by-default development controller; only one mode owner may run.
# Match camera.launch: all models stay ACTIVE, even with missing GPS/context.
# zone_ids below document consumption references, not publication gates while
# always_active is true. See docs/handoffs/perception-to-planning.md.
# measured_prepare_p99_sec is historical 09-21/4060 Ti transition evidence,
# not a current TRT timing guarantee or readiness outside the shadow ODD.
# Evidence: config/baselines/perception_camera_acceptance_followup_v1.yaml
context_freshness_sec: 0.5
prepare_lead_sec: 3.0
prepare_min_distance_m: 20.0
prepare_margin_m: 5.0
recovery_hold_sec: 0.5
recovery_exit_margin_m: 5.0
gps_loss_modes: {twinlite: 2, yolo: 2, resnet18: 2}
models:
  twinlite:
    node: /camera_semantic_inference
    zone_ids: [gps_shadow_candidate]
    initial_mode: 2
    always_active: true
    target_hz: 15.0
    measured_prepare_p99_sec: 3.412
  yolo:
    node: /camera_object_detector
    zone_ids: []
    initial_mode: 2
    always_active: true
    target_hz: 15.0
    measured_prepare_p99_sec: 0.353
  resnet18:
    node: /traffic_light_infer
    zone_ids: [traffic_light_activation_A236_to_A308]
    initial_mode: 2
    always_active: true
    target_hz: 10.0
    measured_prepare_p99_sec: 0.495
