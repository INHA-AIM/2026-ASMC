schema_version: 1
profile: camera_runtime_profiles_v1
launch_profiles:
  default: idle
  idle: {load_models: false, inference: false, visualization: false}
  planning: {load_models: true, managed: true, initial_mode: STANDBY, visualization: false}
  debug: {load_models: true, managed: true, initial_mode: ACTIVE, visualization: true}
  legacy: {camera_lane: true, camera_objects: false, traffic_light: false, managed: false}
model_target_hz: {twinlite: 10.0, yolo: 15.0, resnet18: 10.0}
activation_owner: planning
# Component flags select node creation. A loaded managed model's service controls inference.

components:
  camera_objects:
    enabled_by_default: false
    launch_argument: start_camera_objects
    canonical_topic: /perception/camera/objects
    diagnostics_topic: /perception/camera/objects/diagnostics
    source_stamp_policy: source_image_header
    views: [front, left, right]
    default_model_profile: finetuned_e8
    selectable_model_profiles: [finetuned_e8, pretrained_coco7]
    model_selection_policy: startup_restart
    class_profile: mission16_v1
    implementation: asmc_camera/object_detection_node.py
    consumer: Main/camera_objects_yolo_bbox_adapter.py
  camera_lane:
    enabled_by_default: false
    sensor_set: ASMC_sensor_set_v3
    output_frame: base_link
    source_stamp_policy: newest_synchronized_camera_source
    implementation_owner: asmc_camera
    support_library_owner: asmc_camera
    support_library_namespaces:
      - asmc_camera.camera
      - asmc_camera.bev
    support_config_evidence: config/baselines/perception_support_config_parity_v1.yaml
    bev_debug_metadata:
      enabled_by_default: false
      launch_argument: publish_bev_debug_metadata
      enabled_by_legacy_rqt: true
      topics:
        - /perception/bev/debug/front/coverage
        - /perception/bev/debug/left/coverage
        - /perception/bev/debug/right/coverage
        - /perception/bev/camera/source_count
        - /perception/bev/debug/source_view
    lane_pipeline_audit:
      enabled_by_default: false
      launch_argument: lane_publish_pipeline_audit
      topic: /perception/lane/pipeline_audit
      enable_for: result_bag_evaluation
    lane_family:
      enabled_by_default: true
      canonical_topic: /perception/lane/boundary_family
      operating_domain: shadow_two_way_v1
      shared_family_debug_enabled_by_default: false
      shared_family_debug_topic: /perception/lane/debug/shared_family/markers
      compatibility_topic: /perception/lane/boundary_observations
      compatibility_topic_policy: noncanonical_diagnostic_only
      compatibility_topic_enabled_by_default: false
      compatibility_launch_argument: lane_enable_independent_boundary_pipeline
  traffic_light:
    enabled_by_default: false
    activation_owner: planning
    legacy_topics: [/traffic_light/state, /traffic_light/detail]
    canonical_topic: /perception/traffic_light/detection
    implementation: asmc_camera/traffic_light_node.py
    canonical_producer_status: active_parallel_p4c
    parity_evidence: config/baselines/perception_traffic_light_parity_v1.yaml
    planning_consumer_cutover_status: typed_preferred_legacy_fallback_p4c3
    decision_closed_loop_acceptance: p4c4_traffic_light_behavior_closed_loop_v1
    vehicle_closed_loop_acceptance: p4c4_traffic_light_vehicle_closed_loop_v1
    mission_activation_status: pending_hd_map_zone_integration
  visualization:
    enabled_by_default: false
    object_overlay:
      enabled_by_default: false
      enabled_with: [start_visualization, start_camera_objects]
      image_topic: /perception/camera/objects/debug/image/compressed
      depends_on_lidar_or_gps: false
    traffic_light_overlay:
      enabled_by_default: false
      enabled_with: [start_visualization, start_traffic_light]
      image_topic: /perception/traffic_light/debug/image/compressed
    image_topics:
      - /perception/camera/debug/mosaic/compressed
      - /perception/bev/debug/comparison/compressed
      - /perception/camera/objects/debug/image/compressed
      - /perception/traffic_light/debug/image/compressed
    legacy_rqt:
      enabled_by_default: false
      launch_argument: visualization_legacy_rqt
      image_topics:
        - /perception/camera/front/debug/panel/compressed
        - /perception/camera/left/debug/panel/compressed
        - /perception/camera/right/debug/panel/compressed
        - /perception/bev/debug/fused/compressed
        - /perception/bev/debug/fused_quality/compressed
        - /perception/lane/debug/evidence_bev/compressed
        - /perception/lane/debug/fitted_bev/compressed
        - /perception/lane/debug/boundaries_bev/compressed
        - /perception/lane/debug/shared_family_bev/compressed
        - /perception/lane/debug/camera_reprojection_mosaic/compressed
    calibration_grid:
      enabled_by_default: false
      launch_argument: visualization_calibration_grid

compatibility:
  preserve_legacy_topics: true
  physical_source_moves: true
  physical_source_move_scope: camera_bev_lane_runtime_offline_training_and_config
  compatibility_python_namespaces: removed_p4c6
  compatibility_config_paths: removed_after_hash_guarded_migration
  representative_bag_parity: passed_p4c5
  package_deletions: true
  removed_packages: [camera_semantic_perception, drivable_bev, traffic_light]
  oracle_inputs_allowed: false
  planning_consumer:
    package: asmc_planner
    canonical_topic: /perception/traffic_light/detection
    legacy_fallback_topic: /traffic_light/state
    invalid_or_stale_policy: unknown_without_fallback
    closed_loop_status: physical_vehicle_closed_loop_p4c4
    closed_loop_scope: behavior_frenet_mpc_ctrl_udp_morai_motion

external_components:
  recorder:
    owner_package: data_collection
    profile_owner: data_collection
    integration_policy: independent_runtime
  lidar_fusion:
    owner_workspace: src/lidar+sensorfusion
    integration_policy: team_owned_deferred_until_handoff
    producer_status: opt_in_camera_producer_with_Main_adapter_p2a
