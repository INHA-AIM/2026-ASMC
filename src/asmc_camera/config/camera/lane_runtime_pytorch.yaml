# Explicit recovery profile for the canonical 960/640 inputs. Restart to select.
model_config: large
checkpoint: $(find asmc_camera)/models/lane_segmentation/twinlite-large-v7-e8.pt
backend: twinlite
device: cuda
views: [front, left, right]
amp: true
channels_last: true
lazy_outputs: true
warmup_iterations: 1
batch_wait_ms: 20.0
publish_model_grid_road_marking: true
model_grid_max_hz: 15.0
