# Historical experiment only: model assets are no longer bundled.
# Restore the matching files from commit af6df9e6 before replay; see config/artifacts/git-history-assets-v1.json.
# RTX 50(sm_120) 임시 실행용. coco7_three_view_candidate.yaml의 사본이며
# head_profile을 명시해 parameter server 잔류값에 의존하지 않는다.
# TensorRT .engine은 다른 GPU arch/TRT 버전 산출물이라 sm_120에서 로드되지 않는다.
views:
- front
- left
- right
image_topic: /image_jpeg/compressed
weights: $(find asmc_camera)/models/object_detection/yolo11m.pt
expected_sha256: d5ffc1a674953a08e11a8d21e022781b1b23a19b730afc309290bd9fb5305b95
device: cuda:0
require_cuda: true
conf_thres: 0.7
allowed_names:
- person
- dog
- bicycle
- car
- motorcycle
- bus
- truck
batched_runtime: true
runtime_backend: pytorch
task: detect
front_width: 640
batch_mode: 2plus1
batch_wait_ms: 10
label_mode: source
head_profile: legacy_coco7
