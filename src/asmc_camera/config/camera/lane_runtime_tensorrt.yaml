# Historical T2 profile for reproduction; canonical camera.launch now uses TensorRT.
# Canonical camera.launch requests15Hz; legacy perception.launch keeps10Hz.
device: cuda
# Tensor sizes are shared with the model-grid projector via lane_input.yaml.
views: [front, left, right]
amp: true
channels_last: true
warmup_iterations: 1
batch_wait_ms: 20.0
publish_model_grid_road_marking: true
model_grid_max_hz: 15.0
backend: twinlite_tensorrt
checkpoint: $(find asmc_camera)/models/lane_segmentation/twinlite-medium-v6.pt
engine_manifest: $(find asmc_camera)/models/lane_segmentation/manifest.json
gpu_preprocess: true
lazy_outputs: true
