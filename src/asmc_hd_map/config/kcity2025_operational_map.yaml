  sanity_width_max_m: 4.5
  fallback_width_m: 3.5

legacy_gate:
  # A legacy template may extend slightly beyond a directly observed run. A
  # 0.55 majority-support gate keeps those ends conservative while retaining
  # the A2256W000748 paint whose supported span has centimetre-level residual.
  minimum_observed_coverage: 0.55
  maximum_lateral_residual_p95_m: 0.25
  maximum_heading_difference_p95_deg: 5.0
  # Retained as an audit metric only. It compares the observed 2025 lane width
  # against the current-link 3.5 m proxy, not the fitted marking error, so it
  # must not reject an individually well-aligned physical marking.
  maximum_width_difference_m: 0.25
  maximum_projection_distance_m: 2.0
  maximum_projection_heading_deg: 30.0

# Route-by-route human holdout decisions. These do not relax the automatic
# gate for any other legacy feature. `extend_to_boundary_end` only closes the
# short reviewed paint tail to the owning current logical boundary endpoint.
driving_reviewed_intervals:
  - name: start_to_first_stopline
    lane_id: A2256W000748
    route_s_min_m: 0.0
    route_s_max_m: 72.62896869677363
    stopline_node_id: A1256W000736
    successor_link_id: A2256W000182
    successor_geometry_role: logical_corridor_only
    opposing_lane_markings_included: false
    review_source: live_route_review_20260916

driving_reviewed_markings:
  B219BS010411:
    interval: start_to_first_stopline
    side: left
    color: yellow
    pattern: solid
    clip_to_reviewed_lane: true
    extend_to_boundary_start: true
    extend_to_boundary_end: true
    maximum_extension_m: 2.5
  B219BS010474:
    interval: start_to_first_stopline
    side: right
    color: white
    pattern: solid
    clip_to_reviewed_lane: true
    extend_to_boundary_start: true
    extend_to_boundary_end: false
  B219BS011269:
    interval: start_to_first_stopline
    side: right
    color: white
    pattern: solid
    clip_to_reviewed_lane: true
    extend_to_boundary_start: false
    extend_to_boundary_end: true
    maximum_extension_m: 2.5

stoplines:
