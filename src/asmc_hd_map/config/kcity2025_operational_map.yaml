  # confirmed to have no paint and is explicitly rejected.
  h5_allowlist: [A1256W000682, A1256W000807, A1256W000208, A1256W000757, A1256W000582, A1256W000593, A1256W000709]
  driving_review_allowlist:
    A1256W000736: live_route_review_20260916_painted_stopline
