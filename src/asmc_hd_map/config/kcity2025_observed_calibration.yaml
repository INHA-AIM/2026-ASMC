  sha256: 209a0d06fdecaa570c6364a791b7b3f2a5404dc1e8f570d9bb54841fcfe57b9a
  expected_map_id: kcity2025_competition_corridor_nominal_v1

expected_rows:
  total: 26511
  direct: 25414
  current_lidar_semantic: 13679
  current_gps_direct: 11735
  generated: 958
  interpolated: 139

segmentation:
  resample_step_m: 0.25
  max_time_gap_sec: 0.5
  max_point_gap_m: 1.5

matching:
  search_distance_m: 2.0
  max_heading_deg: 30.0
  connected_transition_cost: 0.25

automatic_gate:
  minimum_observed_length_m: 5.0
  minimum_resampled_points: 20
  minimum_coverage: 0.80
  maximum_nominal_distance_p95_m: 0.75
  maximum_fit_residual_p95_m: 0.20
  maximum_outlier_ratio: 0.20
  maximum_abs_correction_m: 1.0
  maximum_offset_slope_m_per_m: 0.15

review_gate:
  minimum_coverage: 0.60
  maximum_nominal_distance_p95_m: 1.50
  maximum_abs_correction_m: 2.0

profile:
  station_bin_m: 1.0
  mad_multiplier: 3.0
  maximum_interpolation_gap_m: 2.0
  maximum_source_disagreement_p95_m: 0.30

promotion_policy:
  operational: false
  feature_status: candidate
  permit_new_intersection_boundaries: false
  apply_generated_rows: false
  apply_interpolated_rows: false
  apply_manual_bridges: false
  apply_raster_inward_offset: false

