schema_version: asmc.hd_map.compact_drivable_source/v6
build_id: kcity2025_static_junction_widened_drivable_v6
scope: competition_route_and_usable_same_direction_lanes

sources:
  input_audit:
    path: src/asmc_hd_map/config/kcity2025_drivable_area_input_audit.yaml
  current_link_set:
    path: src/behavior_planner/src/config/link_set.json
  reviewed_lane_markings:
    path: src/asmc_hd_map/reports/kcity2025_route_curation_20260917/route_curated_candidate_map.json
  competition_metadata:
    path: src/asmc_hd_map/config/kcity2025_competition_metadata.yaml
  legacy_drivable_h5:
    path: src/asmc_hd_map/development/won_tae_link_node/out/link_node_map.h5

selection:
  # Same-road lanes are retained only when they travel in the route direction.
  # These are physical shoulder/bus/toll lanes that the reviewed H5 explicitly
  # excluded, plus A427 which the route review deliberately stopped using.
  excluded_lane_links:
    - A2256W000429
    - A2256W000433
    - A2256W000421
    - A2256W000425
    - A2256W000424
    - A2256W000426
    - A2256W000427
    # A179 is the exit-only lane at this junction, not usable competition road.
    - A2256W000179
  minimum_direction_dot: 0.25
  # P2-B v3 is link-driven. No proximity/radius expansion is allowed at an
  # intersection. Non-route links must be named in one of these groups.
  intersection_link_types: ['1']
  explicit_intersection_groups:
    route_only_connectors:
      - A2256W000182
      - A2256W000236
      - A2256W000215
    static_obstacle_maneuver:
      - A2256W000746
      - A2256W000221
      - A2256W000222
      - A2256W000111
      - A2256W000227
      - A2256W000100
      - A2256W000226
      # Outermost southbound junction link beside A746; the only A222 junction
      # link that was left out of the reviewed box (H5 road covers it).
      - A2256W001212
    dynamic_obstacle_maneuver:
      - A2256W000599
      - A2256W000206
      - A2256W001124
      - A2256W000636
    non_mission_route_turns:
      - A2256W000318
      - A2256W000319
      - A2256W000083
    # Planner-reviewed extension into the roundabout surface. A134 is not on
    # the frozen global route, but is a valid roundabout maneuver link.
    roundabout_maneuver:
      - A2256W000134
  # Close the directed start-node x end-node combinations defined by the four
  # reviewed dynamic-obstacle anchors. This adds only intersection links whose
  # endpoints are already on that reviewed junction boundary (A1125/A066/
  # A087/A211); it does not pull approach roads or nearby links by distance.
  intersection_node_pair_closures:
    dynamic_obstacle_maneuver:
      anchor_link_ids:
        - A2256W000599
        - A2256W000206
        - A2256W001124
        - A2256W000636
  # The GPS-shadow mission may use the opposite carriageway beside A126.
  # A131 is deliberately isolated from its non-competition predecessor and
  # successor; only this reviewed shadow segment is published.
  explicit_lane_groups:
    gps_shadow_opposite_lane:
      - A2256W000131
  endpoint_cap_style: node_normal_flat
  centerline_resample_m: 0.25

surface_refinement:
  # On ordinary roads, follow a reviewed marking when its local signed lateral
  # distance is trustworthy; retain the nominal link edge through long paint
  # gaps and at unsupported intersection geometry.
  reviewed_boundary_snap:
    enabled: true
    maximum_distance_m: 4.0
    minimum_side_coverage: 0.20
    smoothing_window_m: 1.25
  # Fill every selected MGeo lane-change pair, plus the explicitly reviewed
  # opposite-direction A126/A131 shadow corridor, between their centerlines.
  bridge_selected_adjacent_lanes: true
  explicit_bridge_pairs:
    - id: gps_shadow_A126_A131
      group: gps_shadow_opposite_lane
      link_ids: [A2256W000126, A2256W000131]
  # H5 is used only as a surface boundary reference inside each selected
  # component's reviewed vector envelope. Obstacle junctions close internal
  # gaps, while the roundabout keeps the H5 center island non-drivable and
  # admits the full pavement around A134 beyond its nominal 3.5 m width.
  legacy_h5_intersection_surface_groups:
    - group: static_obstacle_maneuver
      envelope_buffer_m: 0.0
      preserve_holes: false
    - group: dynamic_obstacle_maneuver
      envelope_buffer_m: 0.0
      preserve_holes: false
    - group: roundabout_maneuver
      envelope_buffer_m: 2.0
      preserve_holes: true
      supplemental_link_ids:
        - A2256W000151
  minimum_patch_area_m2: 0.50
  vector_simplify_tolerance_m: 0.05
  # The A222 static-obstacle junction corners are paved beyond the nominal
  # 3.5 m right-turn links, and H5 cannot fill them because it was baked from
  # the same link widths. GetMGeo was refused by the simulator (2026-10-05) and
  # the observed-lane CSVs stop at the junction, so the inner-corner side of
  # each right turn is widened conservatively from the organizer route figure
  # registered to the official global path (about 0.5 m/px): pavement measured
  # 1.0-1.75 m past A226 and 1.25-2.75 m past A111. Zero at both nodes.
  intersection_link_widening:
    - link_id: A2256W000226
      side: right
      maximum_extra_m: 1.0
      profile: half_sine
      basis: route_figure_registered_to_global_path_20261005
    - link_id: A2256W000111
      side: right
      maximum_extra_m: 1.5
      profile: half_sine
      basis: route_figure_registered_to_global_path_20261005

raster:
  # Native H5 was 0.20 m/px. v1 downsampled it to 0.40 m/px; v2+ use
  # 0.20 m/px and rasterize clean vector link-width polygons directly.
  output_resolution_m: 0.20
  padding_m: 2.0
  occupancy:
    drivable: 0
    non_drivable: 100
    unknown: -1

outputs:
  product: src/asmc_hd_map/config/kcity2025_compact_drivable_map.json
  grid: src/asmc_hd_map/config/kcity2025_compact_drivable_grid.npz
  report: docs/records/baselines/kcity2025-compact-drivable-v1.md
