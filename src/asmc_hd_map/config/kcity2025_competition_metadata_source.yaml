schema_version: asmc.competition_metadata.source/v1
metadata_id: kcity2025_competition_metadata_v1
contract_id: asmc_hd_map_topic_contract_v1
frame_id: map

# Official scoring facts, NOT a participant-side judge or new spatial zones.
# Attached to all three effective speed zones so any route station exposes the
# same whole-route rules without changing MissionZone MD5 or geometry/counts.
route_rules:
  authority: official
  source_reference: official_rule_v1_2_20260930_sections_2_2_3_and_3
  scope: whole_route
  run:
    time_limit_s: 900
    on_time_limit_exceeded: run_failure
    mission_order_required: true
    on_skipped_mission_or_checkpoint: run_failure
  checkpoints:
    pass_radius_m: 3.0
    sequential_pass_required: true
    recovery_requires_operator_and_team_approval: true
    approved_recovery_penalty_s: 15
  lane_keeping:
    judged_by: ego_detail_status_wheel_contact
    marking_types: [white_solid, yellow_solid, centerline]
    wheel_contact_count_min: 1
    sustained_contact_repeat_s: 3
    penalty_s: 5
    exempt_zone_ids: [gps_shadow_candidate]
  collision: &collision_rule
    judged_by: collision_data
    collision_penalty_s: 15
    continuous_contact_additional_penalty: false
    recollision_additional_penalty: true

inputs:
  official_checkpoints: $ASMC_DATA/R_KR_PG_K-city_2025/2026_molit_comp_checkpoints.json
  official_global_path: $ASMC_DATA/R_KR_PG_K-city_2025/2026_molit_comp_global_path.txt
  current_link_set: $ASMC_DATA/R_KR_PG_K-city_2025/link_set.json
  route_links: src/asmc_planner/config/behavior/route_links_1.yaml
  reviewed_hd_map: src/asmc_hd_map/reports/kcity2025_route_curation_20260917/route_curated_candidate_map.json

# P1-A/P1-C frozen inputs. A changed organizer file or reviewed map must be
# explicitly reviewed here instead of being silently accepted by --write.
input_sha256:
  official_checkpoints: 8e853c1cbf2443e6df5c6aeeef1e02ec996649f117fd7180e2c64b97245fdef2
  official_global_path: 50658991e607d9339d76e4cd6cb169dfc733ea53b93de2c3e222460bb497cc05
  current_link_set: 5ce0fd57da07b83221c0a4d117b0606b2d9c094c8de476a7d1176c78a4dc5b0f
  route_links: d5444dce6da7bb7da1f88c3cdf1cbdef4e1a0eebcf8d0d7a5db03830a97554bf
  reviewed_hd_map: 21f7da31ec592089264fe604310f7bedcd005818e2f2b2e0ac2c4d44454c05a2

validation:
  checkpoint_count: 15
  pass_radius_m: 3.0
  expected_route_length_m: 2184.6117233360696
  route_length_tolerance_m: 0.000001
  route_closure_tolerance_m: 0.000001
  link_continuity_tolerance_m: 0.000001
  checkpoint_route_projection_max_error_m: 0.001
  checkpoint_link_projection_max_error_m: 0.001

# Checkpoints at a shared link node are geometrically ambiguous. This reviewed
# assignment preserves the route ownership agreed in the P1-A roadmap. The
# official position and yaw are never changed by this mapping. Rule book v1.2
# (2026-09-30) removed the 2026-08-03 checkpoint 11 on A411 and renumbered
# 12-15 to 11-14 without moving them.
checkpoint_link_assignment:
  START_END: A2256W000748
  "1": A2256W000748
  "2": A2256W000236
  "3": A2256W000215
  "4": A2256W000222
  "5": A2256W000205
  "6": A2256W000318
  "7": A2256W000083
  "8": A2256W000304
  "9": A2256W000866
  "10": A2256W000846
  "11": A2256W000445
  "12": A2256W000153
  "13": A2256W000446
  "14": A2256W000126

mission_zones:
  - id: start_success_5_percent
    mission_type: start_success
    status: derived_official
    source_reference: official_rule_route_5_percent
    description: 출발 후 공식 전역경로 길이의 5%를 통과하면 출발 성공
    bounds: {kind: route_fraction, start_fraction: 0.0, end_fraction: 0.05}
    rule_payload: {required_route_fraction: 0.05, time_limit_s: 60, on_failure: run_failure}

  # Effective competition speed profile.  Keep these route partitions
  # non-overlapping so planning does not have to apply an all-route rule and
  # then discover an exception by priority.
  - id: speed_limit_60_before_high_speed
    mission_type: speed_limit
    status: derived_official
    source_reference: official_rule_mapped_to_route_links
    description: 출발부터 A846 종료까지 적용되는 공식 최고속도 60 km/h 구간
    bounds: {kind: link_span, start_link_id: A2256W000748, end_link_id: A2256W000846}
    speed_limit_kph: 60.0
    rule_payload:
      interpretation: effective_competition_speed_limit
      judged_by: ego_vehicle_status_speed
      overspeed_penalty_s: 15
      first_penalty: immediately_on_exceeding_limit
      sustained_overspeed_repeat_s: 3

  - id: high_speed_exception
    mission_type: high_speed_exception
    status: derived_official
    source_reference: official_rule_mapped_to_route_links
    description: 공식 고주로 속도 예외 corridor를 route link 경계에 투영
    bounds: {kind: link_span, start_link_id: A2256W000411, end_link_id: A2256W000153}
    rule_payload:
      speed_limit_kph: null
      interpretation: no_competition_speed_cap
      official_boundary: A2256W000411 start to A2256W000153 end

  - id: speed_limit_60_after_high_speed
    mission_type: speed_limit
    status: derived_official
    source_reference: official_rule_mapped_to_route_links
    description: A451 시작부터 START/END까지 다시 적용되는 공식 최고속도 60 km/h 구간
    bounds: {kind: link_span, start_link_id: A2256W000451, end_link_id: A2256W000751}
    speed_limit_kph: 60.0
    rule_payload:
      interpretation: effective_competition_speed_limit
      judged_by: ego_vehicle_status_speed
      overspeed_penalty_s: 15
      first_penalty: immediately_on_exceeding_limit
      sustained_overspeed_repeat_s: 3

  - id: traffic_light_activation_A236_to_A308
    mission_type: traffic_light
    status: team_final
    review: {reviewed_on: '2026-10-05', decision: boundary_signed_off_for_competition}
    source_reference: team_qna_and_situation_review
    description: A236 시작부터 A308 종료까지만 신호등 인지 노드 활성화가 필요한 구간
    bounds: {kind: link_span, start_link_id: A2256W000236, end_link_id: A2256W000308}
    rule_payload:
      perception_monitoring: activation_zone
      spatial_mission: false
      policy_scope: link_span
      runtime_activation_hint: enable_within_zone_only
      disable_outside_zone: true
      stop_decision_requires_validated_signal_and_stopline: true

  - id: gps_shadow_candidate
    mission_type: gps_shadow
    status: team_final
    review: {reviewed_on: '2026-10-05', decision: boundary_signed_off_for_competition}
    source_reference: team_map_review_shadow_zone
    description: A448 종료 노드부터 A126 종료까지의 GPS 음영 후보
    bounds: {kind: after_link_to_link_end, after_link_id: A2256W000448, end_link_id: A2256W000126}
    rule_payload:
      usable_opposite_lane_link_ids: [A2256W000131]
      drivable_area_bridge_id: gps_shadow_A126_A131
      # Rule book v1.2: GPS is fully blacked out, lane keeping is not scored
      # here, and the random mission inside the zone is obstacle avoidance only.
      gps_blackout: true
      lane_keeping_penalty: false
      # Official text says obstacle avoidance, not static-only. This is a rule
      # category, not a MissionZone TYPE enum or a scenario spawn instruction.
      random_mission_types: [obstacle_avoidance]

  - id: static_obstacle_candidate
    mission_type: static_obstacle
    status: team_final
    review: {reviewed_on: '2026-10-06', decision: widened_to_organizer_figure_box}
    source_reference: team_qna_and_organizer_route_figure
    description: A213 중간부터 A220 끝까지, 장애물이 놓이는 A222 교차로와 접근·복귀 거리를 포함한 정적 장애물 구간
    # The organizer figure boxes the junction with its approach and exit, so the
    # zone gives planning distance to prepare and to return to its lane. The
    # obstacle itself is expected inside the junction (obstacle_expected_link_ids,
    # and the scenario generator spawns only there).
    bounds: {kind: link_fraction_span, start_link_id: A2256W000213, start_fraction: 0.5, end_link_id: A2256W000220, end_fraction: 1.0}
    rule_payload:
      boundary_interpretation: A213_midpoint_through_A220_end
      obstacle_expected_link_ids: [A2256W000222]
      judged_by: collision_data
      collision_penalty_s: 15
      continuous_contact_additional_penalty: false
      recollision_additional_penalty: true

  - id: dynamic_obstacle_candidate
    mission_type: dynamic_obstacle
    status: team_final
    review: {reviewed_on: '2026-10-06', decision: widened_to_organizer_figure_box}
    source_reference: team_qna_and_organizer_route_figure
    description: A202 중간부터 A315 앞부분까지, A728-A205 교차로와 접근·복귀 거리를 포함한 동적 장애물 구간
    # Same principle as the static zone: about 30 m of approach before the
    # A728 stop line and 20 m of exit after A205; actors stay on the junction links.
    bounds: {kind: link_fraction_span, start_link_id: A2256W000202, start_fraction: 0.5, end_link_id: A2256W000315, end_fraction: 0.3}
    rule_payload:
      boundary_interpretation: A202_midpoint_through_A315_30_percent
      obstacle_expected_link_ids: [A2256W000728, A2256W000599, A2256W000207, A2256W000205]
      judged_by: collision_data
      collision_penalty_s: 15
      continuous_contact_additional_penalty: false
      recollision_additional_penalty: true

  - id: roundabout_candidate
    mission_type: roundabout
    status: team_final
    review: {reviewed_on: '2026-10-05', decision: boundary_signed_off_for_competition}
    source_reference: official_figure_team_link_mapping
    description: A148-A146-A151 회전교차로 후보
    bounds: {kind: link_span, start_link_id: A2256W000148, end_link_id: A2256W000151}
    rule_payload: {<<: *collision_rule, mission: npc_cut_in}

  - id: surrounding_vehicle_candidate
    mission_type: surrounding_vehicle
    status: team_final
    review: {reviewed_on: '2026-10-05', decision: boundary_signed_off_for_competition}
    source_reference: official_figure_team_link_mapping
    description: A411-A420-A408-A445-A153 주변 차량 인지 후보
    bounds: {kind: link_span, start_link_id: A2256W000411, end_link_id: A2256W000153}
    rule_payload: {<<: *collision_rule, mission: npc_cut_in}

traffic_light_zones:
  derive_from_reviewed_stoplines: true
  status: team_final
  review: {reviewed_on: '2026-10-05', decision: boundary_signed_off_for_competition}
  source_reference: stage14_reviewed_stopline_projection
  planning_enforcement_allowed: true
  # v1.2 signal-scoring follow-up notice, received 2026-10-06. Five map
  # boundaries are NOT five judged intersections. Mapping remains unverified.
  rule_payload:
    judgement: signal_when_front_wheels_cross_stopline
    proceed_on: [green, left_turn_arrow]
    scoring_source_reference: official_v1_2_signal_scoring_followup_received_20261006
    violation_penalty_s: 30
    run_failure_condition: all_judged_intersections_violated
    judged_intersection_count: 4
    violation_count_unit: distinct_judged_intersection
    violation_count_scope: current_run
    count_same_intersection_once: true
    reset_count_on_checkpoint_return: false
    judged_intersection_mapping_status: unverified
    judged_intersection_id: null
    intersection_failure_evaluation_available: false
