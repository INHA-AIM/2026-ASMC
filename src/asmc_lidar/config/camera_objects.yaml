# Canonical three-view receiver, projection, matching and fusion.
schema_version: 1
implementation_status: three_view_fusion_enabled
observation_contract: config/contracts/camera_object_observation_v1.yaml
observation_topic: /perception/camera/objects/observations
status_topic: /perception/camera/objects/status
cameras:
  front: camera_front
  left: camera_left
  right: camera_right
calibration_config: $(find asmc_camera)/config/cameras_v3.yaml
class_groups_config: $(find asmc_camera)/config/camera/object_classes_mission15_v1.yaml
current_consumer:
  runtime_host: asmc_lidar
  input_topic: /perception/camera/objects/observations
  camera_scope: all
  output_topic: /perception/lidar/tracks_map

control_contract: config/contracts/camera_inference_control_v2.yaml
buffer:
  capacity_per_view: 8
  retention_ms: 350
  status_freshness_ms: 350
  future_tolerance_ms: 50
  query_policy: nonblocking_nearest_candidates_caller_supplies_tolerance
