# Reusable camera receiver/buffer/projection; 3-view object matching and fusion remain migration work.
schema_version: 1
implementation_status: receiver_buffer_projection_ready_fusion_not_implemented
# Status of this receiver contract. The opt-in shadow node (docs/shadow-pipeline.md)
# fuses camera_front only; 3-view fusion is not implemented.
observation_contract: config/contracts/camera_object_observation_v1.yaml
observation_topic: /perception/camera/objects/observations
status_topic: /perception/camera/objects/status
cameras:
  front: camera_front
  left: camera_left
  right: camera_right
calibration_config: $(find asmc_camera)/config/cameras_v3.yaml
class_groups_config: $(find asmc_camera)/config/camera/object_classes_mission16_v1.yaml
current_compatibility:
  runtime_host: Main
  input_topic: /perception/camera/objects
  camera_scope: front
  output_topic: /YOLO/BBox

control_contract: config/contracts/camera_inference_control_v2.yaml
buffer:
  capacity_per_view: 8
  retention_ms: 350
  status_freshness_ms: 350
  future_tolerance_ms: 50
  query_policy: nonblocking_nearest_candidates_caller_supplies_tolerance
