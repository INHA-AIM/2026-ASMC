provenance:
  baseline_commit: 8f93c22ec247ec8a84ef5c1512898a7d2c64e23f
  deviations:
  - lidar.level_roll is true (roll+pitch leveling, shadow default). main.launch default
    lidar_level_roll=false is Main's pitch-only common profile.
  - calibration_id = shadow:<sha256 of this file>:<sha256 of mount_config>. Main uses
    sha256(lidar mount yaml):sha256(camera yaml):sha256(map contract); the two identity
    strings are intentionally different.
  - pose.lidar_pose_history_duration_s is Main's code default (not set in main.launch).
  - fusion.exclude_ymin_px/exclude_ymax_px and fusion.camera_objects_conf_thres are
    Main/adapter code defaults (main.launch sets only conf_thres=0.0).
  - 'ground_fallback_frames is not listed: previous-plane reuse is legacy-only in
    Main.'
  sources:
  - copied: vehicle (Vehicle.Length/Width/WheelBase/FrontOverhang/RearOverhang, Vehicle.LiDAR
      x..yaw, Vehicle.GPS x..z); lidar.Range/ROI (LiDAR.Filter.Range/ROI); lidar.Clustering;
      lidar.Tracking
    git_blob: a0b22195c82125839e7b03fb4204a863ecfa8d78
    path: src/lidar+sensorfusion/src/Main/setting.yaml
  - copied: ground.*, pose.*, gps_sanity.*, map.map_altitude_origin_m, fusion.* (arg/param
      values); lidar.level_roll is overridden, see deviations
    git_blob: b7b24859da5af88c9908a2978bcb2fc4e696c7bb
    path: src/lidar+sensorfusion/src/Main/main.launch
  - copied: map.origin = local_crop_policy.gps_imu_policy.local_origin_in_global
    git_blob: 42fc9656b6b8b792a9e438bb459f4544de65a9d6
    path: config/contracts/hd_map_topic_contract_v1.yaml
  - copied: referenced by mount_config; checked against vehicle.LiDAR within 1e-6
      (Main frame_boundary::Configure)
    git_blob: f64cfe4e52548b4a8274e38f6179ff2d3c5dfa0b
    path: src/asmc_lidar/config/autonav_v3.yaml
