# Four terminals in the same ROS container/workspace. Physics/model settings
# come from the team's existing launches; these values only coordinate startup.
instance: validation
gpu_python: auto  # ASMC_YOLO_PYTHON, otherwise the ROS system Python
twinlite_root: auto  # existing /opt checkout, or .runtime/TwinLiteNetPlus
camera_runtime: auto  # .runtime/camera_runtime.json when prepared; off uses the team engine
startup_timeout_s: 90
stop_timeout_s: 15
heartbeat_timeout_s: 5
client_timeout_s: 15
readiness:
  stable_s: 0.5
  position_tolerance_m: 0.75
  yaw_tolerance_deg: 5
  stopped_speed_mps: 0.3
  state_age_s: 0.2
  objects_age_s: 0.3
  trajectory_age_s: 0.25
