name: Full regression (manual)

on:
  workflow_dispatch:

# A newer PR revision supersedes older checks; main push validation completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CCACHE_DIR: ${{ github.workspace }}/.ci-cache/ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 400M
  PIP_CACHE_DIR: ${{ github.workspace }}/.ci-cache/pip

jobs:
  full-regression:
    runs-on: ubuntu-22.04
    container: ros:noetic-perception@sha256:ef5fdebeaa881604208c067f96d42b61331825309e559c093e24e9e89c7d3d2e
    defaults:
      run:
        shell: bash
    steps:
      # ros:noetic 이미지에 git이 없으면 checkout(submodules)이 REST fallback으로 실패함
      - name: Install git and build deps
        run: |
          # Same signed Ubuntu repositories; avoid observed HTTP download failures.
          sed -i -e 's|http://archive.ubuntu.com|https://archive.ubuntu.com|g' \
            -e 's|http://security.ubuntu.com|https://security.ubuntu.com|g' /etc/apt/sources.list
          apt-get -o Acquire::Retries=3 update
          # Last line: asmc_lidar shadow pipeline build_depend (PCL, GeographicLib, pcl_conversions, rosbag).
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            git ca-certificates ccache libyaml-cpp-dev libssl-dev libeigen3-dev libopencv-dev python3-opencv python3-numpy python3-scipy python3-pil python3-nose python3-pip python3-dev pybind11-dev \
            ros-noetic-tf ros-noetic-tf2-ros ros-noetic-rostest \
            libpcl-dev libgeographic-dev ros-noetic-pcl-conversions ros-noetic-rosbag ros-noetic-visualization-msgs
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # Preserve the dashboard tests' Node runtime from Planning integration.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Restore C++ compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-noetic-ccache-v2-${{ github.job }}-${{ hashFiles('src/**/*.cpp', 'src/**/*.hpp', 'src/**/*.h', 'src/**/*.cc', 'src/**/CMakeLists.txt', 'src/**/package.xml', 'src/**/*.msg', 'src/**/*.srv') }}
          restore-keys: |
            ${{ runner.os }}-noetic-ccache-v2-${{ github.job }}-
            ${{ runner.os }}-noetic-ccache-v2-
            ${{ runner.os }}-noetic-ccache-

      - name: Reset cache statistics and check CI coverage
        run: |
          ccache --zero-stats
          python3 tools/ci/check_coverage.py
          python3 -m unittest discover -s tools/ci -p 'test_*.py'
      - name: Verify morai_msgs submodule
        run: |
          test -d src/MORAI-ROS_morai_msgs/.git || test -f src/MORAI-ROS_morai_msgs/package.xml
          echo "morai_msgs present"

      - name: Check portable data paths and optional storage profiles
        run: |
          PYTHONPATH=src/data_collection/src python3 -m unittest discover -s src/data_collection/test -p 'test_storage_paths.py'
          PYTHONPATH=src/data_collection/src python3 -m unittest discover -s src/data_collection/test -p 'test_data_locations.py'
          python3 -m unittest tools/audit/test_storage_launchers.py
          python3 -m unittest tools/audit/test_data_location_preflight.py

      - name: Verify documentation migration
        run: python3 tools/audit/check_documentation_migration.py
      - name: Test documentation link and retention checks
        run: python3 -m unittest tools/audit/test_documentation_migration.py

      - name: Verify current models and history-only asset inventory
        run: |
          python3 tools/audit/check_git_history_assets.py
          python3 -m unittest tools/audit/test_git_history_assets.py

      - name: Check current launch documentation
        run: |
          python3 tools/audit/check_runtime_documentation.py
          python3 -m unittest tools/audit/test_runtime_documentation.py

      - name: Verify bridge profiles
        run: |
          python3 tools/bridge/render_morai_network_profiles.py --check
          python3 tools/audit/validate_bridge_profiles.py
          python3 -m unittest tools/audit/test_bridge_profiles.py

      - name: Verify shared message contracts
        run: |
          python3 tools/audit/validate_p1b_contract.py
          python3 tools/audit/validate_perception_contract.py
          python3 tools/audit/validate_perception_topic_policy.py
          python3 tools/audit/validate_perception_runtime_acceptance.py
          python3 -m unittest tools/audit/test_p1b_contract.py
          python3 -m unittest tools/audit/test_perception_contract.py
          python3 -m unittest tools/audit/test_perception_topic_policy.py
          python3 -m unittest tools/audit/test_perception_runtime_acceptance.py
          python3 -m unittest tools/perception/test_camera_object_parity.py
          python3 -m unittest tools/perception/test_legacy_yolo_reference.py
          python3 -m unittest tools/perception/test_camera_handoff_replay.py
          python3 -m unittest tools/perception/test_fusion_diagnostics.py
          python3 -m unittest tools/perception/test_track_continuity.py

      - name: Build every runtime and test target through one graph
        run: |
          source /opt/ros/noetic/setup.bash
          # A missing pipeline dependency fails the configure step instead of skipping the targets.
          ./scripts/build_ws.sh full -j2 -l2 -DCMAKE_BUILD_TYPE= -DASMC_LIDAR_PIPELINE_REQUIRED=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

          test -x devel/lib/asmc_lidar/camera_receiver_ros_test

      - name: Require compiled lane association for parity regressions
        run: |
          source devel/setup.bash
          python3 -c 'from asmc_camera import _lane_association; print(_lane_association.__file__)'

      - name: C0 coordinate and clock regression (small synthetic inputs)
        run: |
          source devel/setup.bash
          cmake -S tools/perception/frame_time -B /tmp/asmc-c0-probes -DASMC_C0_RUNTIME_LIB_DIR="$PWD/devel/lib" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build /tmp/asmc-c0-probes -j2
          C0_PROBES=/tmp/asmc-c0-probes python3 tools/perception/test_frame_time_audit.py
          python3 tools/perception/frame_time/test_state_probes.py --probes /tmp/asmc-c0-probes

      - name: Save successful compilation before regression tests
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}

      - name: Restore pinned CPU runtime downloads
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-noetic-pip-v1-${{ hashFiles('.github/ci/cpu-requirements.txt', '.github/ci/bootstrap-requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-noetic-pip-v1-
      - name: Install CPU tensor runtime for preprocessing regression
        run: |
          python3 -m pip install --disable-pip-version-check -r .github/ci/bootstrap-requirements.txt
          python3 -m pip install --disable-pip-version-check -r .github/ci/cpu-requirements.txt
          python3 -m pip check
          python3 -c 'import numpy, scipy, cv2, torch, torchvision; from scipy.spatial import cKDTree; from scipy.spatial.transform import Rotation; print("CI stack:", numpy.__version__, scipy.__version__, cv2.__version__, torch.__version__)'

      - name: Run all isolated regression groups
        run: python3 tools/ci/run_checks.py --output .ci-results --workers 2
      - name: Preserve regression logs and status even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-results
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
      - name: Report compiler cache reuse
        if: always()
        run: command -v ccache >/dev/null && ccache --show-stats || true

