name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CCACHE_DIR: ${{ github.workspace }}/.ci-cache/ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 400M
  PIP_CACHE_DIR: ${{ github.workspace }}/.ci-cache/pip-essential

jobs:
  validated-lidar-build:
    name: validated-lidar-build
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !**/*.pt
            !**/*.engine
            !**/*.onnx
            !**/*.tar.gz
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install contract parser
        run: python3 -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Check essential contracts and Python syntax
        run: bash .github/ci/essential-contracts.sh

  planning-catkin-build:
    name: planning-catkin-build
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    container: ros:noetic
    defaults:
      run:
        shell: bash
    steps:
      - name: Install small build dependencies
        run: |
          sed -i -e 's|http://archive.ubuntu.com|https://archive.ubuntu.com|g' -e 's|http://security.ubuntu.com|https://security.ubuntu.com|g' /etc/apt/sources.list
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends git ca-certificates build-essential cmake ccache libyaml-cpp-dev libeigen3-dev libssl-dev libgtest-dev python3-nose ros-noetic-rostest ros-noetic-rosbag ros-noetic-tf ros-noetic-tf2-ros
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Restore production compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-essential-ccache-v1-planning-${{ hashFiles('src/**/*.cpp', 'src/**/*.hpp', 'src/**/*.h', 'src/**/CMakeLists.txt', 'src/**/package.xml', 'src/**/*.msg', 'src/**/*.srv') }}
          restore-keys: |
            ${{ runner.os }}-essential-ccache-v1-planning-
            ${{ runner.os }}-noetic-ccache-v2-catkin-build-
            ${{ runner.os }}-noetic-ccache-v2-
      - name: Build production targets and critical tests
        run: |
          ccache --zero-stats
          mkdir .ci-essential
          python3 tools/ci/build_essential.py planning 2>&1 | tee .ci-essential/build.log
      - name: Save compilation before test execution
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Run critical planning checks
        run: bash .github/ci/essential-planning.sh 2>&1 | tee .ci-essential/tests.log
      - name: Preserve essential logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essential-planning-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-essential
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Compiler cache statistics
        if: always()
        run: command -v ccache >/dev/null && ccache --show-stats || true

  catkin-build:
    name: catkin-build
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    container: ros:noetic-perception@sha256:ef5fdebeaa881604208c067f96d42b61331825309e559c093e24e9e89c7d3d2e
    defaults:
      run:
        shell: bash
    steps:
      - name: Install small build dependencies
        run: |
          sed -i -e 's|http://archive.ubuntu.com|https://archive.ubuntu.com|g' -e 's|http://security.ubuntu.com|https://security.ubuntu.com|g' /etc/apt/sources.list
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends git ca-certificates build-essential cmake ccache libyaml-cpp-dev libeigen3-dev libssl-dev libgtest-dev python3-nose ros-noetic-rostest ros-noetic-rosbag ros-noetic-tf ros-noetic-tf2-ros libopencv-dev libpcl-dev libgeographic-dev pybind11-dev python3-dev python3-pip python3-opencv ros-noetic-pcl-conversions
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Restore production compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-essential-ccache-v1-perception-${{ hashFiles('src/**/*.cpp', 'src/**/*.hpp', 'src/**/*.h', 'src/**/CMakeLists.txt', 'src/**/package.xml', 'src/**/*.msg', 'src/**/*.srv') }}
          restore-keys: |
            ${{ runner.os }}-essential-ccache-v1-perception-
            ${{ runner.os }}-noetic-ccache-v2-catkin-build-
            ${{ runner.os }}-noetic-ccache-v2-
      - name: Build production targets and critical tests
        run: |
          ccache --zero-stats
          mkdir .ci-essential
          python3 tools/ci/build_essential.py perception 2>&1 | tee .ci-essential/build.log
      - name: Save compilation before test execution
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Restore small scientific Python wheels
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-essential-pip-v1-${{ hashFiles('.github/ci/essential-requirements.txt', '.github/ci/bootstrap-requirements.txt') }}
      - name: Install only the essential CPU math stack
        run: |
          python3 -m pip install --disable-pip-version-check -r .github/ci/bootstrap-requirements.txt
          python3 -m pip install --disable-pip-version-check -r .github/ci/essential-requirements.txt
      - name: Run critical perception checks
        run: bash .github/ci/essential-perception.sh 2>&1 | tee .ci-essential/tests.log
      - name: Preserve essential logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: essential-perception-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-essential
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Compiler cache statistics
        if: always()
        run: command -v ccache >/dev/null && ccache --show-stats || true
