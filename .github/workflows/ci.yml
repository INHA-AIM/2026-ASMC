name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  catkin-build:
    runs-on: ubuntu-22.04
    container: ros:noetic
    defaults:
      run:
        shell: bash
    steps:
      # ros:noetic 이미지에 git이 없으면 checkout(submodules)이 REST fallback으로 실패함
      - name: Install git and build deps
        run: |
          # Same signed Ubuntu repositories; avoid observed HTTP download failures.
          sed -i -e 's|http://archive.ubuntu.com|https://archive.ubuntu.com|g' \
            -e 's|http://security.ubuntu.com|https://security.ubuntu.com|g' /etc/apt/sources.list
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            git ca-certificates libyaml-cpp-dev libssl-dev libeigen3-dev libopencv-dev python3-opencv python3-numpy python3-scipy python3-pil python3-nose python3-pip \
            ros-noetic-tf ros-noetic-tf2-ros ros-noetic-rostest
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify morai_msgs submodule
        run: |
          test -d src/MORAI-ROS_morai_msgs/.git || test -f src/MORAI-ROS_morai_msgs/package.xml
          echo "morai_msgs present"

      - name: Verify documentation migration
        run: python3 tools/audit/check_documentation_migration.py
      - name: Test documentation link and retention checks
        run: python3 -m unittest tools/audit/test_documentation_migration.py

      - name: Check current launch documentation
        run: |
          python3 tools/audit/check_runtime_documentation.py
          python3 -m unittest tools/audit/test_runtime_documentation.py

      - name: Verify bridge profiles
        run: |
          python3 tools/bridge/render_morai_network_profiles.py --check
          python3 tools/audit/validate_bridge_profiles.py
          python3 -m unittest tools/audit/test_bridge_profiles.py

      - name: Verify shared message contracts
        run: |
          python3 tools/audit/validate_p1b_contract.py
          python3 tools/audit/validate_perception_contract.py
          python3 tools/audit/validate_perception_topic_policy.py
          python3 tools/audit/validate_perception_runtime_acceptance.py
          python3 tools/audit/check_legacy_lidar_publishers.py
          python3 -m unittest tools/audit/test_p1b_contract.py
          python3 -m unittest tools/audit/test_perception_contract.py
          python3 -m unittest tools/audit/test_perception_topic_policy.py
          python3 -m unittest tools/audit/test_perception_runtime_acceptance.py
          python3 -m unittest tools/audit/test_legacy_lidar_publishers.py
          python3 -m unittest tools/perception/test_camera_object_parity.py
          python3 -m unittest tools/perception/test_legacy_yolo_reference.py
          python3 -m unittest tools/perception/test_camera_handoff_replay.py
          python3 -m unittest tools/perception/test_fusion_diagnostics.py
          python3 -m unittest tools/perception/test_track_continuity.py

      - name: catkin_make
        run: |
          source /opt/ros/noetic/setup.bash
          ./scripts/build_ws.sh

      - name: Check LiDAR camera receiver, coordinates and time
        run: |
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash
          catkin_make camera_receiver_ros_test -j2 -l2
          cd build/asmc_lidar
          ctest --output-on-failure

      - name: Check bridge protocols, concurrent reporting and stale recovery
        run: |
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash
          catkin_make run_tests_asmc_bridge -j2 -l2
          catkin_test_results --verbose build/test_results/asmc_bridge

      - name: Install CPU tensor runtime for preprocessing regression
        run: python3 -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.1.2+cpu'

      - name: Check camera object processing without a GPU
        run: |
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash
          python3 -m unittest discover -s tools/perception -p 'test_camera_model_release.py'
          python3 -m unittest discover -s src/asmc_camera/test -p 'test_facade_contract.py'
          python3 -m unittest discover -s src/asmc_camera/test/detection -p 'test_*.py'
          python3 -m unittest discover -s src/asmc_camera/test/camera -p 'test_*.py'
          python3 -m unittest discover -s src/asmc_camera/test/bev -p 'test_*.py'
          python3 -m unittest tools/perception/test_hood_evaluation.py
          python3 -m unittest tools/perception/test_lifecycle_measurements.py
          python3 -m unittest tools/perception/test_b0_measurements.py
          python3 -m unittest tools/perception/test_coco7_evaluation.py
          python3 -m unittest discover -s tools/perception -p 'test_coco7_weather.py'
          python3 -m unittest discover -s tools/perception -p 'test_coco7_batch_benchmark.py'
          python3 -m unittest discover -s tools/perception -p 'test_coco7_range_batches.py'
          python3 -m unittest discover -s tools/perception -p 'test_coco7_finalists.py'
          python3 -m unittest discover -s tools/perception -p 'test_coco7_broad_selection.py'
          python3 -m unittest discover -s tools/perception -p 'test_coco7_confidence_followup.py'
          python3 -m unittest discover -s tools/perception -p 'test_experiment_gallery_hub.py'
          python3 -m unittest discover -s tools/perception -p 'test_camera_coco_measurements.py'
          python3 -m unittest discover -s tools/perception -p 'test_camera_coco_matrix.py'
          python3 -m unittest discover -s tools/perception -p 'test_camera_seg_gt.py'
          python3 -m unittest discover -s tools/perception -p 'test_seg_measurements.py'
          python3 -m unittest discover -s tools/perception -p 'test_camera_seg_matrix.py'
          python3 -m unittest discover -s tools/perception -p 'test_seg_lidar_support.py'
          python3 -m unittest discover -s tools/perception -p 'test_camera_seg_accuracy.py'
          python3 -m unittest discover -s tools/perception -p 'test_camera_mission_classes.py'
          python3 -m unittest discover -s tools/perception -p 'test_camera_data_audit.py'
          python3 -m unittest discover -s tools/perception -p 'test_camera_data_readiness.py'
          python3 -m unittest discover -s tools/perception -p 'test_prepare_camera_direct_review.py'
          python3 -m unittest discover -s tools/perception -p 'test_prepare_camera_breadth_dataset.py'
          python3 -m unittest discover -s tools/perception -p 'test_prepare_camera_obstacle_review.py'
          python3 -m unittest discover -s tools/perception -p 'test_prepare_capture_training_data.py'
          python3 -m unittest discover -s tools/perception -p 'test_camera_bbox_pilot.py'
          python3 -m unittest discover -s tools/perception -p 'test_camera_bbox_training.py'
          python3 -m unittest discover -s tools/perception -p 'test_rfdetr_candidate.py'
          python3 -m unittest discover -s tools/perception -p 'test_camera_label_changes.py'
          python3 -m unittest discover -s tools/perception -p 'test_camera_teacher_audit.py'
          python3 -m unittest discover -s tools/perception -p 'test_camera_teacher_expansion.py'
          python3 -m unittest discover -s tools/perception -p 'test_capture_route_export.py'
          python3 -m unittest discover -s tools/perception -p 'test_capture_collection_guard.py'
          python3 -m unittest discover -s tools/perception -p 'test_capture_gt_sizes.py'
          python3 -m unittest discover -s tools/perception -p 'test_capture_pedestrian_respawn.py'
          PYTHONPATH=src/data_collection/src python3 -m unittest discover -s src/data_collection/test -p 'test_capture*.py'
          python3 -m unittest discover -s tools/perception -p 'test_camera_data_expansion_v7.py'
          python3 -m unittest discover -s tools/perception -p 'test_yoloe_l_measurements.py'
          python3 -m unittest discover -s tools/perception -p 'test_yoloe_selection.py'
          python3 -m unittest discover -s tools/perception -p 'test_yoloe_l_diagnostics.py'
          python3 -m unittest tools/perception/test_b1a_protocol.py
          python3 -m unittest tools/perception/test_frame_boundary_measurements.py
          python3 -m unittest tools/perception/test_lidar_continuous_measurements.py
          python3 -m unittest tools/perception/test_tunnel_case_geometry.py
          python3 -m unittest tools/perception/test_tunnel_summary.py
          python3 -m unittest tools/perception/test_camera_lidar_evidence.py
          python3 -m unittest discover -s src/asmc_camera/test/runtime -p 'test_*.py'
          python3 -m unittest discover -s tools/perception -p 'test_camera_runtime_measurements.py'
          python3 -m unittest discover -s tools/perception -p 'test_shadow_family_validation.py'

      - name: Check inference control faults with generated ROS messages
        run: |
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash
          export ROS_MASTER_URI=http://127.0.0.1:11312
          export ROS_HOSTNAME=localhost
          roscore -p 11312 > /tmp/camera-control-roscore.log 2>&1 &
          core_pid=$!
          trap 'kill "$core_pid" 2>/dev/null || true' EXIT
          python3 tools/perception/check_inference_control_ros.py
          python3 tools/perception/check_camera_coco_ros.py --profile baseline
          python3 tools/perception/check_camera_coco_ros.py --profile all
          python3 tools/perception/check_camera_seg_ros.py
          python3 tools/perception/check_camera_seg_ros.py --batched
          roslaunch --nodes asmc_camera camera_objects_coco_experiment.launch classes:=all
          roslaunch --nodes asmc_camera camera_objects_coco_experiment.launch classes:=baseline debug:=false
          roslaunch --nodes asmc_camera camera_objects_seg_experiment.launch model:=yolo26 views:=front debug:=false
          roslaunch --nodes asmc_camera camera_objects_seg_experiment.launch model:=yoloe views:=all debug:=false
          roslaunch --nodes asmc_camera camera_objects_seg_experiment.launch model:=yolo26 classes:=mission debug:=false
          roslaunch --nodes asmc_camera camera_objects_seg_experiment.launch model:=yoloe classes:=mission views:=all debug:=false
          roslaunch --nodes asmc_camera camera_objects_yoloe_l_experiment.launch debug:=false
          roslaunch --nodes asmc_camera camera_objects_yoloe_l_experiment.launch prompt_profile:=base27 batch_mode:=batch3 debug:=false
          roslaunch --nodes asmc_camera camera_objects_three_view_experiment.launch debug:=false
          roslaunch --nodes asmc_camera camera_objects_three_view_experiment.launch debug:=true
          roslaunch --nodes asmc_camera camera_yoloe_experiment.launch model:=m front_width:=640 prompt_profile:=obstacle17
          roslaunch --nodes asmc_camera camera_yoloe_experiment.launch model:=l front_width:=1280 start_camera_lane:=true start_traffic_light:=true
          python3 tools/perception/check_region_example_ros.py
          python3 tools/perception/check_object_visualization_ros.py
          python3 tools/perception/check_object_visualization_ros.py --hood-mask
          python3 tools/perception/check_object_visualization_ros.py --hood-mask --debug-raw
          python3 tools/perception/check_object_visualization_ros.py --hood-mask --view left
          python3 tools/perception/check_object_visualization_ros.py --hood-mask --view right
          python3 tools/perception/check_object_mosaic_ros.py --output /tmp/object-mosaic-ros-check.json
          python3 tools/perception/check_object_view_ros.py
          python3 tools/perception/check_hood_mask_ros.py
          python3 tools/perception/check_ego_hood_filter_ros.py
          python3 tools/perception/check_object_visualization_ros.py --ego-hood-filter
