name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  catkin-build:
    runs-on: ubuntu-22.04
    container: ros:noetic
    defaults:
      run:
        shell: bash
    steps:
      # ros:noetic 이미지에 git이 없으면 checkout(submodules)이 REST fallback으로 실패함
      - name: Install git and build deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates libyaml-cpp-dev libeigen3-dev libopencv-dev python3-opencv python3-numpy python3-nose \
            ros-noetic-tf ros-noetic-tf2-ros ros-noetic-rostest
          rm -rf /var/lib/apt/lists/*

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify morai_msgs submodule
        run: |
          test -d src/MORAI-ROS_morai_msgs/.git || test -f src/MORAI-ROS_morai_msgs/package.xml
          echo "morai_msgs present"

      - name: Verify documentation migration
        run: python3 tools/audit/check_documentation_migration.py

      - name: Verify bridge profiles
        run: |
          python3 tools/bridge/render_morai_network_profiles.py --check
          python3 tools/audit/validate_bridge_profiles.py
          python3 -m unittest tools/audit/test_bridge_profiles.py

      - name: Verify shared message contracts
        run: |
          python3 tools/audit/validate_p1b_contract.py
          python3 tools/audit/validate_perception_contract.py
          python3 tools/audit/validate_perception_topic_policy.py
          python3 tools/audit/validate_perception_runtime_acceptance.py
          python3 -m unittest tools/audit/test_p1b_contract.py
          python3 -m unittest tools/audit/test_perception_contract.py
          python3 -m unittest tools/audit/test_perception_topic_policy.py
          python3 -m unittest tools/audit/test_perception_runtime_acceptance.py
          python3 -m unittest tools/perception/test_camera_object_parity.py
          python3 -m unittest tools/perception/test_fusion_diagnostics.py

      - name: catkin_make
        run: |
          source /opt/ros/noetic/setup.bash
          ./scripts/build_ws.sh

      - name: Check camera object processing without a GPU
        run: |
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash
          python3 -m unittest discover -s src/asmc_camera/test/detection -p 'test_*.py'
          python3 -m unittest discover -s src/asmc_camera/test/runtime -p 'test_*.py'

      - name: Check inference control faults with generated ROS messages
        run: |
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash
          export ROS_MASTER_URI=http://127.0.0.1:11312
          export ROS_HOSTNAME=localhost
          roscore -p 11312 > /tmp/camera-control-roscore.log 2>&1 &
          core_pid=$!
          trap 'kill "$core_pid" 2>/dev/null || true' EXIT
          python3 tools/perception/check_inference_control_ros.py
          python3 tools/perception/check_region_example_ros.py
          python3 tools/perception/check_object_visualization_ros.py
          python3 tools/perception/check_object_visualization_ros.py --hood-mask
