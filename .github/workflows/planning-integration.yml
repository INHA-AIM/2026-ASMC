name: Planning integration build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/asmc_planner/**'
      - 'src/asmc_controller/**'
      - 'src/planning_inputs/**'
      - 'src/asmc_msgs/**'
      - 'src/asmc_lidar/**'
      - 'src/asmc_camera/**'
      - 'src/jamming_lane_boundary_adapter/**'
      - '.github/workflows/planning-integration.yml'
      - '.github/workflows/ci.yml'
      - '.github/ci/**'
      - 'tools/ci/**'

# A newer PR revision supersedes older checks; main push validation completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keep the existing check identity while retiring the third heavy ROS build.
  validated-lidar-build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Only this source audit excludes binary assets. The full regression
          # checkout keeps deployment weights and historical evidence intact.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !**/*.pt
            !**/*.engine
            !**/*.onnx
            !**/*.tar.gz
      - name: Check canonical LiDAR dependencies and input ownership
        run: python3 tools/audit/check_lidar_canonicalization.py

  # Dependency-isolation audit on demand, not a second build on every PR.
  planning-standalone-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    container: ros:noetic
    defaults:
      run:
        shell: bash
    steps:
      - name: Install minimal planning dependencies
        run: |
          sed -i -e 's|http://archive.ubuntu.com|https://archive.ubuntu.com|g' \
            -e 's|http://security.ubuntu.com|https://security.ubuntu.com|g' /etc/apt/sources.list
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends git ca-certificates libyaml-cpp-dev libopencv-dev libeigen3-dev libssl-dev python3-nose ros-noetic-rostest ros-noetic-rosbag ros-noetic-tf ros-noetic-tf2-ros
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build planning in isolation
        run: |
          source /opt/ros/noetic/setup.bash
          ./scripts/build_ws.sh -j2 -l2 -DCATKIN_WHITELIST_PACKAGES="asmc_geometry;asmc_msgs;morai_msgs;planning_inputs;asmc_planner;asmc_controller"
