name: Planning integration build

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/behavior_planner/**'
      - 'src/frenet_planner/**'
      - 'src/mpc_controller/**'
      - 'src/planning_inputs/**'
      - '.github/workflows/planning-integration.yml'

jobs:
  planning-catkin-build:
    runs-on: ubuntu-22.04
    container: ros:noetic
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates libyaml-cpp-dev libopencv-dev python3-nose ros-noetic-rostest ros-noetic-tf ros-noetic-tf2-ros
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check runtime launch contracts
        run: |
          python3 src/planning_inputs/test/runtime_launch_contract_test.py
          python3 src/planning_inputs/test/object_filter_contract_test.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check dashboard motion rendering
        run: node src/behavior_planner/test/dashboard_motion_test.js
      - name: Build ROS workspace
        run: |
          source /opt/ros/noetic/setup.bash
          ./scripts/build_ws.sh
      - name: Run planning input tests
        run: |
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash
          ./devel/lib/planning_inputs/planning_motion_test
          catkin_make planning_filter_test
          ./devel/lib/planning_inputs/planning_filter_test

      - name: Check real ROS planning input boundary
        run: |
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash
          python3 src/planning_inputs/test/ros_boundary_smoke_test.py
