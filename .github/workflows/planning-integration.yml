name: Planning integration build

on:
  workflow_dispatch:

# A newer PR revision supersedes older checks; main push validation completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Dependency-isolation audit on demand, not a second build on every PR.
  planning-standalone-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    container: ros:noetic
    defaults:
      run:
        shell: bash
    steps:
      - name: Install minimal planning dependencies
        run: |
          sed -i -e 's|http://archive.ubuntu.com|https://archive.ubuntu.com|g' \
            -e 's|http://security.ubuntu.com|https://security.ubuntu.com|g' /etc/apt/sources.list
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends git ca-certificates libyaml-cpp-dev libopencv-dev libeigen3-dev libssl-dev python3-nose ros-noetic-rostest ros-noetic-rosbag ros-noetic-tf ros-noetic-tf2-ros
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build planning in isolation
        run: |
          source /opt/ros/noetic/setup.bash
          ./scripts/build_ws.sh full -j2 -l2 -DCATKIN_WHITELIST_PACKAGES="asmc_geometry;asmc_msgs;morai_msgs;planning_inputs;asmc_planner;asmc_controller"
