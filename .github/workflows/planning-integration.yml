name: Planning integration build

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/asmc_planner/**'
      - 'src/asmc_controller/**'
      - 'src/planning_inputs/**'
      - 'src/lidar+sensorfusion/src/Main/**'
      - 'src/asmc_msgs/**'
      - 'src/asmc_lidar/**'
      - 'src/asmc_camera/**'
      - 'src/jamming_lane_boundary_adapter/**'
      - '.github/workflows/planning-integration.yml'

# A newer PR revision supersedes older checks; main push validation completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CCACHE_DIR: ${{ github.workspace }}/.ci-cache/ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 400M
  PIP_CACHE_DIR: ${{ github.workspace }}/.ci-cache/pip

jobs:
  planning-catkin-build:
    runs-on: ubuntu-22.04
    container: ros:noetic
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          # Same signed Ubuntu repositories; avoid observed HTTP download failures.
          sed -i -e 's|http://archive.ubuntu.com|https://archive.ubuntu.com|g' \
            -e 's|http://security.ubuntu.com|https://security.ubuntu.com|g' /etc/apt/sources.list
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends git ca-certificates ccache libyaml-cpp-dev libopencv-dev libeigen3-dev libssl-dev python3-nose ros-noetic-rostest ros-noetic-tf ros-noetic-tf2-ros
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Restore C++ compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-noetic-ccache-${{ github.job }}-v1-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-noetic-ccache-${{ github.job }}-v1-
      - name: Check runtime launch contracts
        run: |
          python3 src/planning_inputs/test/runtime_launch_contract_test.py
          python3 src/planning_inputs/test/object_filter_contract_test.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check dashboard motion rendering
        run: node src/asmc_planner/tests/behavior/dashboard_motion_test.js
      - name: Build ROS workspace
        run: |
          source /opt/ros/noetic/setup.bash
          ./scripts/build_ws.sh -j2 -l2 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Run planning input tests
        run: |
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash
          ./devel/lib/planning_inputs/planning_motion_test
          catkin_make planning_filter_test
          ./devel/lib/planning_inputs/planning_filter_test

      - name: Check AVOID fixtures and roundabout commit guards
        run: |
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash
          for regression in command_avoid_target_test roundabout_execution_test avoid_road_constraints_test polygon_collision_test; do
            test -x "devel/lib/asmc_planner/$regression"
          done
          cd build/asmc_planner
          ctest --output-on-failure -R '^(command_avoid_target_test|roundabout_execution_test|avoid_road_constraints_test|polygon_collision_test)$'

      - name: Check real ROS planning input boundary
        run: |
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash
          python3 src/planning_inputs/test/ros_boundary_smoke_test.py

      - name: Report compiler cache reuse
        if: always()
        run: command -v ccache >/dev/null && ccache --show-stats || true

  validated-lidar-build:
    runs-on: ubuntu-22.04
    container: ros:noetic
    defaults:
      run:
        shell: bash
    steps:
      - name: Install nested sensor build dependencies
        run: |
          # Same signed Ubuntu repositories; avoid observed HTTP download failures.
          sed -i -e 's|http://archive.ubuntu.com|https://archive.ubuntu.com|g' \
            -e 's|http://security.ubuntu.com|https://security.ubuntu.com|g' /etc/apt/sources.list
          apt-get -o Acquire::Retries=3 update
          apt-get -o Acquire::Retries=3 install -y --no-install-recommends git ca-certificates ccache libyaml-cpp-dev libopencv-dev libpcl-dev libgeographic-dev libssl-dev python3-nose python3-opencv python3-numpy ros-noetic-rostest ros-noetic-rosbag ros-noetic-pcl-conversions ros-noetic-tf ros-noetic-tf2-geometry-msgs ros-noetic-visualization-msgs
          rm -rf /var/lib/apt/lists/*
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Restore C++ compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-noetic-ccache-${{ github.job }}-v1-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-noetic-ccache-${{ github.job }}-v1-
      - name: Build restored LiDAR workspace with frozen messages
        run: |
          source /opt/ros/noetic/setup.bash
          # morai_msgs lets asmc_lidar build its required shadow targets, so nested Main is
          # built and tested against the same asmc_lidar underlay as a full workspace build.
          catkin_make -j2 -l2 -DCATKIN_WHITELIST_PACKAGES='asmc_msgs;asmc_lidar;asmc_camera;morai_msgs;planning_inputs' -DASMC_LIDAR_PIPELINE_REQUIRED=ON -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          source devel/setup.bash
          cd src/lidar+sensorfusion
          catkin_make -j2 -l2 -DCATKIN_ENABLE_TESTING=ON -DCATKIN_WHITELIST_PACKAGES='Main;Msg;morai_msgs' -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Check Main does not link asmc_lidar shadow libraries
        run: |
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash
          python3 src/asmc_lidar/test/pipeline_ci_check.py --devel devel --dependent-build src/lidar+sensorfusion/build
      - name: Check direct common LiDAR planning input without Main wire
        run: |
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash
          catkin_make planning_lidar_observation_test -j2 -l2
          devel/lib/planning_inputs/planning_lidar_observation_test
          python3 src/planning_inputs/test/common_lidar_ros_test.py
      - name: Run validated LiDAR regressions
        run: |
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash
          cd src/lidar+sensorfusion
          source devel/setup.bash
          catkin_make tests -j2 -l2
          catkin_make run_tests -j2 -l2
          catkin_test_results build/test_results
      - name: Check expanded camera labels through actual legacy adapter
        run: |
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash
          source src/lidar+sensorfusion/devel/setup.bash
          export ROS_MASTER_URI=http://127.0.0.1:11316
          export ROS_HOSTNAME=localhost
          roscore -p 11316 > /tmp/camera-coco-adapter-master.log 2>&1 &
          coco_core_pid=$!
          trap 'kill "$coco_core_pid" 2>/dev/null || true' EXIT
          python3 tools/perception/check_camera_coco_ros.py --profile baseline --adapter
          python3 tools/perception/check_camera_coco_ros.py --profile all --adapter
          python3 tools/perception/check_camera_seg_ros.py --adapter
      - name: Check jamming shared detections and Ego-mask contacts
        run: |
          source /opt/ros/noetic/setup.bash
          source devel/setup.bash
          catkin_make -j2 -l2 -DCATKIN_WHITELIST_PACKAGES='asmc_msgs;asmc_lidar;asmc_camera;morai_msgs;lane_boundary_adapter'
          catkin_make -j2 -l2 ground_projection_test
          devel/lib/lane_boundary_adapter/ground_projection_test
          source devel/setup.bash
          # Public camera messages no longer require nested Main/Msg setup.
          for fixture_case in camera_bbox_lane camera_bbox_clipped camera_bbox_lane_change camera_bbox_ego_mask camera_bbox_imu_projection; do
            rostest lane_boundary_adapter "$fixture_case.test"
          done
      - name: Report compiler cache reuse
        if: always()
        run: command -v ccache >/dev/null && ccache --show-stats || true
