regression_evidence:
  archived_full16_frames: 4023
  archived_strict_accept_count: 4023
  archived_reject_count: 0
  interpretation: >-
    The archived 12+4 audit contains no rejected family frame, so it cannot
    measure real-world recovery rate. Candidate v3 does not enter the fallback
    for these strict-accepted frames. Unit regression checks require exact
    equality of control points, centre samples, validity and all boundary
    sample/state arrays with the fallback disabled versus enabled.

limitations:
  - A targeted live or newly recorded high-heading dropout is still required
    to measure real-world activation and false-family rate.
  - too_few_observed_roles, assignment failure, non-monotonic geometry and all
    non-local-support rejection reasons remain rejected.
  - This is a non-deployment candidate and does not grant closed-loop authority.
