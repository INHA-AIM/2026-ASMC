  pre_handoff_algorithm_optimization: not_required
  rationale:
    - Candidate v3 sustained at least 9.381 Hz with zero runtime error in isolated replay.
    - The distributed-support branch was not entered in these bags, while several legacy stages slowed together versus the previous standalone run; this does not identify a v3-specific regression.
    - Geometry, thresholds, and support-state semantics must remain stable for planning integration.
  integration_risk: modest_compute_headroom
  backlog_after_planning_integration:
    - Add an opt-in deployment profile that skips legacy independent spline, temporal tracking, and legacy typed-boundary publication only after planning selects boundary_family as its source.
    - Merge duplicated projection audit/extract traversal with deterministic geometry regression tests.
    - Profile basis construction, robust iterations, residual lookup, and linear solves inside shared-family fit before changing the fitter.
  required_regression_gate:
    - same four raw bags
    - identical algorithm_id, config hash, support-state semantics, and invalid hard split
    - family accepted rate and geometry distributions non-regressing
    - full-stack output at least 9 Hz with planning load

