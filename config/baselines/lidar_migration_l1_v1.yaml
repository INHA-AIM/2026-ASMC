limitations:
- No actual Competition Vehicle Status live capture in these bags. Ego-derived development input cannot establish field
  compliance.
- Online official URL loaded only application shell; newer body changes not verified.
- Raw PointCloud2 fields are x/y/z/intensity; no ring or per-point time for deskew.
- Independent object position/velocity GT absent in these raw regressions.
- Old fixture aliases are historical and not silently recreated. GPS variants need regeneration or current canonical
  discovery before L3 replay.
- Legacy road mask and latest HD map product are pinned separately and are not automatically interchangeable.
- Baseline rear overhang 0.700m differs from regulation summary 0.790m; L2 parity does not silently change it.
- Legacy pitch path does not assign output intensity; preserve XYZ parity, fix metadata/intensity separately rather than
  compare undefined bytes.
