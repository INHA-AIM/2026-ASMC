limits:
  - Fixed 105 correlated Capture snapshots are development regressions, not an independent test set.
  - Projection bins are a geometric representation, not measured ring IDs or beam timestamps.
  - Camera, GPS switching, motion tracking and deployment acceptance are out of this experiment.
  - StandingOBJ109 and unlabelled output counts are diagnostics, not wall GT or measured false positives.
