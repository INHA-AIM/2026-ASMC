rules:
  - Preserve observation stamp, point lineage, and local track state across GPS changes.
  - Distinguish observed-empty, predicted, input-invalid, pose-unavailable and sensor silence.
  - Unknown velocity and dynamic state remain invalid, never a valid zero/static result.
  - Camera missing, empty or stale is not evidence to delete LiDAR objects.
  - Map pose uses already-arrived valid bracketing samples, at most 100 ms apart, without extrapolation.
  - Validate antenna/rear-axle offset, HD-map origin and height before map output.
  - Legacy adapters withhold unrepresentable outputs and report why.
  - Existing operational topic names and message MD5s remain compatible until consumer acceptance.
cutover_gates:
  - original_pipeline_feature_parity_and_documented_intentional_fixes
  - normal_tunnel_recovery_local_continuity_and_map_validity
  - structure_suppression_object_preservation
  - camera_and_three_planner_consumers_acceptance
  - live_rate_latency_drop_and_combined_load_acceptance
