rules:
  - Preserve observation stamp, point lineage, and local track state across GPS changes.
  - Distinguish observed-empty, predicted, input-invalid, pose-unavailable and sensor silence.
  - Unknown velocity and dynamic state remain invalid, never a valid zero/static result.
  - Camera missing, empty or stale is not evidence to delete LiDAR objects.
  - The canonical mission16 profile preserves raw source_class_name and vehicle/dynamic_obstacle/static_obstacle in class_name.
  - A camera profile declares class_name semantics; raw COCO7 outputs preserve original labels and never silently group them.
  - Reused camera evidence keeps its source stamp and does not duplicate a track's temporal class confirmation or miss evidence.
  - Three-view object publication does not imply three-view LiDAR fusion; the current compatibility adapter consumes camera_front only.
  - Strict PoseHistory API uses already-arrived bracketing samples at most 100 ms apart, without extrapolation.
  - Main opt-in BoundedPoseHistory API uses causal normal GPS at most 300 ms old with valid scan IMU and vehicle speed.
  - Invalid GPS disables map immediately; silence exceeding 300 ms disables map; recovery requires three consecutive normal samples.
  - No continued map localization inside GPS-denied regions; no pre/post-outage map velocity difference.
  - Typed observed geometry remains available with unknown velocity and dynamic flags false.
  - Opt-in legacy outputs are withheld if pose or motion validity cannot be represented.
  - Validate antenna/rear-axle offset, HD-map origin and height before map output.
  - Legacy adapters withhold unrepresentable outputs and report why.
  - Existing operational topic names and message MD5s remain compatible until consumer acceptance.
cutover_gates:
  - original_pipeline_feature_parity_and_documented_intentional_fixes
  - normal_tunnel_recovery_local_continuity_and_map_validity
  - structure_suppression_object_preservation
  - camera_and_three_planner_consumers_acceptance
  - live_rate_latency_drop_and_combined_load_acceptance
