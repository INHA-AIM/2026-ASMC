consumer_rules:
  - Planning authority comes from the complete latched global topics, which consumers receive once and spatially index by ego map position.
  - Local lane and grid topics are optional derived caches for bounded lookup and visualization; they are not the planning horizon or a replacement for global semantics.
  - Lane markings, checkpoints, and mission zones are static global metadata and are not republished as local crops.
  - Global topics must use header.frame_id=map and be latched.
  - Local topics are map-frame spatial subsets, not vehicle-frame geometry.
  - Current-lane association uses the map-frame base_link origin, defined by this stack as the rear-axle center after GPS lever-arm correction.
  - Lateral lane switches require 0.30 m target-polygon penetration for two distinct pose samples; a point on a shared boundary retains the previous lane.
  - Explicit predecessor/successor topology wins a node transition; if the established lane has fully left the search neighbourhood and guarded-intersection polygons overlap, a valid route-station lane wins reacquisition. Fresh acquisition and adjacent-lane motion remain proximity-based.
  - Inside an intersection, a non-topological transfer is immediate only after leaving the previous polygon and gaining at least 0.75 m centerline-distance advantage; this prevents large overlapping polygons from holding a stale branch.
  - STATE_NEARBY retains continuity for a departure of at most 2.0 m but is not equivalent to STATE_INSIDE; STATE_STALE is invalid for planning.
  - Only traversable lanes in the global LaneArray are association candidates; excluded bus-only lanes such as the A433-connected high-speed lane cannot become current.
  - IDs in local crops retain their global namespace and identity.
  - Lane numbers are valid only within lane_number_scope_id and the stated station interval.
  - LaneMarking pattern is explicit; consumers must not infer solid or broken from point spacing.
  - DrivableArea intersection_guarded polygons preserve road mesh where lane clipping is unsafe.
  - MissionZone STATUS_UNSPECIFIED is invalid for publication.
  - MissionZone STATUS_PROVISIONAL must not activate mandatory planning or control rules.
  - OccupancyGrid uses 0 for drivable, 100 for non-drivable, and -1 for unknown.
  - Local OccupancyGrid origin orientation must be applied when converting map positions to cells; header.frame_id remains map.
  - Speed-zone rule_payload_json.route_speed_limits lists per-link MGeo maximum, competition cap and effective_limit_kph; divide by 3.6 for SI.
  - Traffic-light mission payloads join traffic_light_id to hd_map_stopline_ids; live signal color comes from perception or simulator, never the static map.

planning_consumption:
  recommended_mode: subscribe_global_once_and_query_by_map_position
  authoritative_global_topics:
    - /hd_map/meta
    - /hd_map/global/lane_markings
    - /hd_map/global/lanes
    - /hd_map/global/drivable_areas
    - /hd_map/global/drivable_grid
    - /hd_map/global/checkpoints
    - /hd_map/global/mission_zones
  optional_local_cache_topics:
    - /hd_map/local/lanes
    - /hd_map/local/drivable_grid
    - /hd_map/local/current_lane
  local_crop_is_planning_horizon: false
  active_mission_selection: consumer_matches_current_link_or_route_station_against_global_mission_zones
  vector_geometry_authority: [/hd_map/global/lanes, /hd_map/global/drivable_areas]
  raster_lookup_derivative: /hd_map/global/drivable_grid
  visualization_only_topic: /hd_map/debug/markers

local_crop_policy:
  production_enabled_by_default: false
  debug_enabled_by_default: false
  purpose: optional_bounded_lookup_and_visualization_cache
  geometry_frame: map
  default_mode: ego
  supported_modes: [ego, map_square]
  front_m: 90.0
  rear_m: 30.0
  left_m: 30.0
  right_m: 30.0
  extent_m: 120.0 # map_square compatibility mode only
  shape: heading_aligned_rectangle
  grid_origin_orientation: ego_yaw_in_map
  grid_axis_x: ego_forward
  grid_axis_y: ego_left
  lane_selection: polygon_or_centerline_bounds_intersects_crop
  lane_geometry_clipped: false
  lane_ids_preserve_global_identity: true
  lane_array_complete: false
  grid_alignment: nearest_global_cell_at_output_cell_center
  grid_resolution_m: 0.2
  grid_width_cells: 600
  grid_height_cells: 300
  outside_global_grid_value: -1
  default_pose_source: gps_imu
  supported_pose_sources: [gps_imu, ego_status, pose_stamped]
  gps_imu_policy:
    gps_topic: /gps
    imu_topic: /imu
    utm_epsg: 32652
    local_origin_in_global: [302595.0, 4124145.0, 0.0]
    gps_lever_arm_m: [0.35, 0.0]
    maximum_pair_gap_ms: 100.0
    maximum_origin_offset_error_m: 1.0
  publish_hz: 20.0
  compute_only_subscribed_local_layers: true
  current_lane_publication: each_distinct_pose_and_stale_timer
  pose_age_policy: source_stamp_and_monotonic_receipt
  stale_crop_policy: stop_publishing_lanes_and_grid_keep_invalid_association
  pose_stale_timeout_sec: 0.5
  current_lane_association:
    topic: /hd_map/local/current_lane
    reference_point: base_link_rear_axle_center
    switch_penetration_m: 0.30
    switch_confirmation_samples: 2
    boundary_band_m: 0.15
    nearby_distance_m: 2.0
    intersection_switch_margin_m: 0.75
    excluded_lane_policy: lanes_absent_from_global_lane_array_are_never_candidates

implementation_stage:
  messages_and_contract: P1-B
  metadata_population: P1-C
  read_only_publisher_and_markers: P1-D
  production_map_publisher: phase_2
