schema_version: 1
contract_id: asmc_perception_runtime_acceptance_v1
status: active
default_duration_sec: 15.0
views: [front, left, right]

phase_status:
  p5c_runtime_acceptance: complete
  p5d_consumer_handoff: complete
  p5e_operational_closeout: complete
  next_development: lidar_fusion_baseline

consumer_handoff:
  traffic_light:
    producer_owner: asmc_camera
    canonical_topic: /perception/traffic_light/detection
    compatibility_topic: /traffic_light/state
    consumer_node: /behavior_planner
    selection_policy: typed_authoritative_after_first_message
    invalid_or_stale_policy: unknown_without_legacy_fallback
    # Historical v1 opt-in policy; standalone v2 starts signal inference only.
    planning_launch_starts_producer_by_default: false
    planning_launch_signal_defaults:
      autonomy_no_bridges.launch: false
      autonomy_no_bridges_v2.launch: true
    compatibility_retirement: deferred_until_all_consumers_are_typed
    evidence:
      - config/baselines/perception_traffic_light_parity_v1.yaml
      - config/baselines/perception_traffic_light_closed_loop_v1.yaml
      - config/baselines/perception_traffic_light_vehicle_closed_loop_v1.yaml
  lane_family:
    producer_owner: asmc_camera
    canonical_topic: /perception/lane/boundary_family
    compatibility_topic: /perception/lane/boundary_observations
    reference_consumer_node: /boundary_family_monitor
    planning_input: typed_family
    debug_topic: /planning/debug/lane_boundary_family/strips
    debug_is_planning_input: false
    compatibility_enabled_by_default: false
    adapter_retirement_owner: planning
    evidence:
      - config/baselines/runtime_baseline_v1.yaml
      - src/data_collection/config/bag_profiles/shadow_camera_perception_handoff_result.yaml
      - src/data_collection/config/bag_profiles/shadow_boundary_family_adapter_result.yaml

operational_closeout:
  runtime_inference_container: asmc-ros-noetic
  training_container: asmc-perception-train
  bridge_process_policy: separate_foreground_for_rate_monitoring
  web_console: deferred_until_operational_demand
  commands:
    bridge: ./scripts/udp_bridge.sh
    perception: roslaunch asmc_camera perception.launch start_traffic_light:=true
    lane_adapter: roslaunch lane_boundary_adapter shadow_boundary_family_candidate.launch
    runtime_acceptance: ./scripts/verify_perception.sh
  visualization:
    rqt_topics:
      - /perception/camera/debug/mosaic/compressed
      - /perception/bev/debug/comparison/compressed
    lane_rviz_fixed_frame: base_link
    lane_rviz_config: src/jamming_lane_boundary_adapter/rviz/shadow_boundary_family_candidate.rviz

topic_groups:
  camera_lane:
    required_nodes:
      - /camera_semantic_inference
      - /camera_bev
      - /camera_bev_fusion
      - /camera_lane_vectorizer
    topics:
      - pattern: /perception/camera/{view}/drivable/probability
        type: sensor_msgs/Image
        publisher: /camera_semantic_inference
        subscribers: [/camera_bev]
        min_rate_hz: 5.0
        require_nonzero_stamp: true
      - pattern: /perception/camera/{view}/road_marking/class_id
        type: sensor_msgs/Image
        publisher: /camera_semantic_inference
        subscribers: [/camera_bev]
        min_rate_hz: 5.0
        require_nonzero_stamp: true
      - pattern: /perception/camera/{view}/road_marking/confidence
        type: sensor_msgs/Image
        publisher: /camera_semantic_inference
        subscribers: [/camera_bev]
        min_rate_hz: 5.0
        require_nonzero_stamp: true
      - pattern: /perception/camera/{view}/road_marking/model_grid/class_id
        type: sensor_msgs/Image
        publisher: /camera_semantic_inference
        subscribers: [/camera_lane_vectorizer]
        min_rate_hz: 5.0
        require_nonzero_stamp: true
      - pattern: /perception/camera/{view}/road_marking/model_grid/confidence
        type: sensor_msgs/Image
        publisher: /camera_semantic_inference
        subscribers: [/camera_lane_vectorizer]
        min_rate_hz: 5.0
        require_nonzero_stamp: true
      - pattern: /perception/bev/debug/{view}/drivable_probability
        type: sensor_msgs/Image
        publisher: /camera_bev
        subscribers: [/camera_bev_fusion]
        frame_id: base_link
        min_rate_hz: 5.0
        require_nonzero_stamp: true
      - pattern: /perception/bev/debug/{view}/road_marking/class_id
        type: sensor_msgs/Image
        publisher: /camera_bev
        subscribers: [/camera_bev_fusion]
        frame_id: base_link
        min_rate_hz: 5.0
        require_nonzero_stamp: true
      - pattern: /perception/bev/debug/{view}/road_marking/confidence
        type: sensor_msgs/Image
        publisher: /camera_bev
        subscribers: [/camera_bev_fusion]
        frame_id: base_link
        min_rate_hz: 5.0
        require_nonzero_stamp: true
      - pattern: /perception/bev/camera/drivable_probability
        type: sensor_msgs/Image
        publisher: /camera_bev_fusion
        frame_id: base_link
        min_rate_hz: 5.0
        require_nonzero_stamp: true
      - pattern: /perception/bev/camera/road_marking/class_id
        type: sensor_msgs/Image
        publisher: /camera_bev_fusion
        frame_id: base_link
        min_rate_hz: 5.0
        require_nonzero_stamp: true
      - pattern: /perception/bev/camera/road_marking/confidence
        type: sensor_msgs/Image
        publisher: /camera_bev_fusion
        frame_id: base_link
        min_rate_hz: 5.0
        require_nonzero_stamp: true
      - pattern: /perception/bev/camera/coverage
        type: sensor_msgs/Image
        publisher: /camera_bev_fusion
        frame_id: base_link
        min_rate_hz: 5.0
        require_nonzero_stamp: true
      - pattern: /perception/lane/boundary_family
        type: asmc_msgs/LaneBoundaryFamily
        publisher: /camera_lane_vectorizer
        frame_id: base_link
        min_rate_hz: 5.0
        require_nonzero_stamp: true
      - pattern: /perception/camera/diagnostics
        type: diagnostic_msgs/DiagnosticArray
        publisher: /camera_semantic_inference
        min_messages: 2
        max_stale_sec: 3.0
      - pattern: /perception/bev/debug/diagnostics
        type: diagnostic_msgs/DiagnosticArray
        publisher: /camera_bev
        min_messages: 2
        max_stale_sec: 3.0
      - pattern: /perception/bev/diagnostics
        type: diagnostic_msgs/DiagnosticArray
        publisher: /camera_bev_fusion
        min_messages: 2
        max_stale_sec: 3.0
      - pattern: /perception/lane/diagnostics
        type: diagnostic_msgs/DiagnosticArray
        publisher: /camera_lane_vectorizer
        min_messages: 2
        max_stale_sec: 3.0

  traffic_light:
    required_nodes: [/traffic_light_infer]
    topics:
      - pattern: /perception/traffic_light/detection
        type: asmc_msgs/TrafficLightDetection
        publisher: /traffic_light_infer
        min_rate_hz: 1.0
        require_nonzero_stamp: true
      - pattern: /traffic_light/state
        type: std_msgs/String
        publisher: /traffic_light_infer
        min_rate_hz: 1.0
      - pattern: /traffic_light/detail
        type: std_msgs/String
        publisher: /traffic_light_infer
        min_rate_hz: 1.0

  visualization:
    required_nodes:
      - /camera_semantic_visualizer
      - /camera_bev_visualizer
    topics:
      - pattern: /perception/camera/debug/mosaic/compressed
        type: sensor_msgs/CompressedImage
        publisher: /camera_semantic_visualizer
        min_rate_hz: 1.0
        require_nonzero_stamp: true
      - pattern: /perception/bev/debug/comparison/compressed
        type: sensor_msgs/CompressedImage
        publisher: /camera_bev_visualizer
        frame_id: base_link
        min_rate_hz: 1.0
        require_nonzero_stamp: true

optional_consumer_gates:
  planning_traffic_light:
    topics:
      - pattern: /perception/traffic_light/detection
        subscribers: [/behavior_planner]
      - pattern: /traffic_light/state
        subscribers: [/behavior_planner]
  lane_adapter:
    topics:
      - pattern: /perception/lane/boundary_family
        subscribers: [/boundary_family_monitor]

default_forbidden_topics:
  - /perception/bev/debug/{view}/coverage
  - /perception/bev/camera/source_count
  - /perception/bev/debug/source_view
  - /perception/lane/pipeline_audit
  - /perception/lane/boundary_observations
  - /perception/camera/{view}/debug/panel/compressed
  - /perception/bev/debug/fused/compressed
  - /perception/bev/debug/fused_quality/compressed
  - /perception/lane/debug/evidence_bev/compressed
  - /perception/lane/debug/fitted_bev/compressed
  - /perception/lane/debug/boundaries_bev/compressed
  - /perception/lane/debug/shared_family_bev/compressed
  - /perception/lane/debug/camera_reprojection_mosaic/compressed
  - /perception/bev/debug/{view}/camera_grid_overlay/compressed

static_bindings:
  - id: ros_runtime_inference_environment
    file: docker/ros-noetic/docker-compose.yaml
    anchors:
      - TWINLITE_ROOT=/opt/baselines/TwinLiteNetPlus
      - /opt/baselines/TwinLiteNetPlus:ro
  - id: canonical_perception_launch
    file: src/asmc_camera/launch/perception.launch
    anchors:
      - pkg="asmc_camera" type="camera_bev_node.py"
      - pkg="asmc_camera" type="camera_bev_fusion_node.py"
      - pkg="asmc_camera" type="lane_vectorizer_node.py"
      - pkg="asmc_camera" type="traffic_light_node.py"
      - '<arg name="lane_enable_boundary_family_candidate" default="true"/>'
      - '<arg name="lane_enable_independent_boundary_pipeline" default="false"/>'
  - id: semantic_launch
    file: src/asmc_camera/launch/camera_lane.launch
    anchors:
      - pkg="asmc_camera" type="semantic_inference_node.py"
  - id: planning_traffic_light_topics
    file: src/behavior_planner/src/node/behavior_node.cpp
    anchors:
      - /perception/traffic_light/detection
      - /traffic_light/state
  - id: planning_traffic_light_provider
    file: src/behavior_planner/src/signal/ros_traffic_light_provider.cpp
    anchors:
      - typed_subscriber_ = nh.subscribe
      - legacy_subscriber_ = nh.subscribe
  - id: planning_traffic_light_config
    file: src/behavior_planner/src/config/behavior_params.yaml
    anchors:
      - 'typed_topic: "/perception/traffic_light/detection"'
      - 'topic: "/traffic_light/state"'
  - id: lane_adapter_config
    file: src/jamming_lane_boundary_adapter/config/shadow_boundary_family_consumer.yaml
    anchors:
      - 'input: /perception/lane/boundary_family'
  - id: lane_adapter_source
    file: src/jamming_lane_boundary_adapter/src/boundary_family_monitor_node.cpp
    anchors:
      - /perception/lane/boundary_family

deferred_components:
  - id: lidar_canonical_runtime
    reason: team-owned nested workspace has not completed P4-D handoff
    topics:
      - /perception/lidar/tracked_objects
      - /perception/lidar/drivable_tracked_objects
