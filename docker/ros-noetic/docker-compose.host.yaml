# Opt-in Docker Desktop host-network test overlay.
#
# Usage:
#   docker compose \
#     -f docker/ros-noetic/docker-compose.yaml \
#     -f docker/ros-noetic/docker-compose.host.yaml up -d --force-recreate
#
# Keep MORAI Host/Destination IP at 127.0.0.1 and keep all sensor port
# numbers unchanged. Host mode removes Docker's per-port forwarding layer;
# publishing ports together with network_mode=host is invalid/ignored.
services:
  asmc-ros-noetic:
    network_mode: host
    ports: !reset []
    environment:
      - MORAI_CMD_IP=127.0.0.1

