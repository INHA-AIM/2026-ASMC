# Docker Desktop + WSL: UDP Destination 포트 publish → MORAI IP는 127.0.0.1/127.0.0.1
# 개발 SIM: 26.R1.h3 (대회 SIM 아님). 치트시트: config/morai_udp_sim_cheat_sheet.md
services:
  asmc-ros-noetic:
    build:
      context: .
      dockerfile: Dockerfile
    image: asmc/ros-noetic:dev
    container_name: asmc-ros-noetic
    gpus: all
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Network Dest
      - "909:909/udp"
      - "7505:7505/udp"
      - "9092:9092/udp"
      # Sensor Dest: cam1–4 → gps → imu → lidar(9311)
      # 9299는 Docker Desktop이 Windows에서 자주 안 열어 lidar=0 → 사용 금지
      - "9291:9291/udp"   # camera-1
      - "9293:9293/udp"   # camera-2
      - "9295:9295/udp"   # camera-3
      - "9297:9297/udp"   # camera-4
      - "9301:9301/udp"   # gps
      - "9303:9303/udp"   # imu
      - "9311:9311/udp"   # 3D LiDAR Dest
      # GT semantic (브릿지 미수신 · publish만 예약)
      - "9305:9305/udp"
      - "9307:9307/udp"
      - "9309:9309/udp"
      - "11311:11311"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=graphics,utility,compute
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - __VK_LAYER_NV_optimus=NVIDIA_only
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - ROS_MASTER_URI=http://127.0.0.1:11311
      - MORAI_CMD_IP=host.docker.internal
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../..:/root/ws:rw
      - /etc/localtime:/etc/localtime:ro
      - ${ASMC_DATA:-../data}:/data:ro
    shm_size: "2gb"
    stdin_open: true
    tty: true
    command: ["tail", "-f", "/dev/null"]
