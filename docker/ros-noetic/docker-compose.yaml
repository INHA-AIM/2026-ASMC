# Docker Desktop + WSL: UDP Destination 포트 publish → MORAI IP는 127.0.0.1/127.0.0.1
# 개발 SIM: 26.R1.h3 (대회 SIM 아님). 치트시트: config/morai_udp_sim_cheat_sheet.md
services:
  asmc-ros-noetic:
    build:
      context: .
      dockerfile: Dockerfile
    image: asmc/ros-noetic:dev
    container_name: asmc-ros-noetic
    gpus: all
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Network Dest
      - "909:909/udp"
      - "7505:7505/udp"
      - "9092:9092/udp"
      # Sensor Dest 순서: cam1–4 → lidar → gps → imu (Host는 publish 금지)
      # LiDAR Dest는 9299 유지. Windows에서 9299가 안 열리면 docker_ros_up.sh up 으로 재생성.
      - "9291:9291/udp"   # camera-1
      - "9293:9293/udp"   # camera-2
      - "9295:9295/udp"   # camera-3
      - "9297:9297/udp"   # camera-4
      - "0.0.0.0:9299:9299/udp"   # 3D LiDAR Dest (명시적 IPv4 bind)
      - "9301:9301/udp"   # gps
      - "9303:9303/udp"   # imu
      # GT semantic Dest (브릿지 미수신 · publish 예약)
      - "9305:9305/udp"
      - "9307:9307/udp"
      - "9309:9309/udp"
      - "11311:11311"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=graphics,utility,compute
      # Host $ASMC_DATA is mounted here. Collectors use this instead of a
      # container-local fallback, so manifests survive container recreation.
      - ASMC_DATA=/data
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - __VK_LAYER_NV_optimus=NVIDIA_only
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - ROS_MASTER_URI=http://127.0.0.1:11311
      - MORAI_CMD_IP=host.docker.internal
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../..:/root/ws:rw
      - /etc/localtime:/etc/localtime:ro
      # Default is the data directory next to the 2026-ASMC repository.
      # ROS owns collection/writer processes, so this mount must be writable.
      - ${ASMC_DATA:-../../../data}:/data:rw
    shm_size: "2gb"
    stdin_open: true
    tty: true
    command: ["tail", "-f", "/dev/null"]
