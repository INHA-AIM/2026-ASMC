# Docker Desktop + WSL host networking.
# MORAI Host/Destination IP와 Ctrl 목적지는 모두 127.0.0.1을 사용한다.
# 지원 SIM: 26.R1.H3 / 25.S4.MolitComp03. 치트시트: config/morai/udp-sim-cheat-sheet.md
services:
  asmc-ros-noetic:
    build:
      context: .
      dockerfile: Dockerfile
    image: asmc/ros-noetic:dev
    container_name: asmc-ros-noetic
    gpus: all
    # Docker Desktop의 개별 UDP 포워딩을 사용하지 않는다. 특히 브릿지를
    # 재시작해도 runtime LiDAR 9299와 개발용 Semantic/Instance GT 9311/9313 수신이
    # 사라지지 않도록 host mode를 기본으로 둔다.
    network_mode: host
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=graphics,utility,compute
      # Host $ASMC_DATA is mounted here. Collectors use this instead of a
      # container-local fallback, so manifests survive container recreation.
      - ASMC_DATA=/data
      # Runtime inference uses the pinned upstream model source read-only.
      # Training remains in the separate asmc-perception-train container.
      - TWINLITE_ROOT=/opt/baselines/TwinLiteNetPlus
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - __VK_LAYER_NV_optimus=NVIDIA_only
      # Host /run/user/<uid> normally does not exist in this root container.
      # Use the image-owned 0700 directory to avoid Qt/rqt/RViz startup faults.
      - XDG_RUNTIME_DIR=/tmp/asmc-xdg-runtime
      - ROS_MASTER_URI=http://127.0.0.1:11311
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../..:/root/ws:rw
      - /etc/localtime:/etc/localtime:ro
      # Default is the data directory next to the 2026-ASMC repository.
      # ROS owns collection/writer processes, so this mount must be writable.
      - ${ASMC_DATA:-../../../data}:/data:rw
      # Official TwinLite source stays outside team Git and is never mutated by
      # the ROS runtime container.
      - ${TWINLITE_SOURCE:-../../../external/baselines/TwinLiteNetPlus}:/opt/baselines/TwinLiteNetPlus:ro
    shm_size: "2gb"
    stdin_open: true
    tty: true
    command: ["tail", "-f", "/dev/null"]
